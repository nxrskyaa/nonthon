<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonthon — Nonton Film & Series Gratis</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #13131a;
            --surface-hover: #1c1c26;
            --primary: #e50914;
            --primary-hover: #f6121d;
            --text: #ffffff;
            --text-dim: #a0a0b0;
            --border: #2a2a35;
            --radius: 10px;
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

        /* Navbar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: linear-gradient(180deg, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0.7) 100%);
            backdrop-filter: blur(12px);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        nav .logo {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary);
            cursor: pointer;
            letter-spacing: -0.5px;
            white-space: nowrap;
        }
        nav .nav-links {
            display: flex;
            gap: 20px;
        }
        nav .nav-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            transition: color .2s;
        }
        nav .nav-links a:hover, nav .nav-links a.active { color: var(--text); }

        /* Provider dropdown */
        .nav-dropdown { position: relative; }
        .dd-toggle { user-select: none; }
        .dd-menu {
            display: none;
            position: absolute;
            top: 28px;
            left: -12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 8px;
            min-width: 460px;
            max-height: 70vh;
            overflow-y: auto;
            z-index: 1200;
        }
        .dd-menu.open { display: block; }
        .dd-group-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
            padding: 8px 8px 4px;
            font-weight: 700;
        }
        .dd-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(130px, 1fr));
            gap: 4px;
        }
        .dd-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.84rem;
            color: var(--text-dim);
            transition: background .15s, color .15s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dd-item:hover { background: var(--surface-hover); color: var(--text); }
        .dd-item.active { background: var(--primary); color: #fff; }
        .dd-item img {
            width: 22px; height: 22px;
            border-radius: 5px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--border);
        }
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0 4px;
        }

        /* Provider page header */
        .provider-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 24px 32px 4px;
        }
        .provider-header img {
            width: 54px; height: 54px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: var(--shadow);
        }
        .provider-header h1 { font-size: 1.7rem; font-weight: 800; }
        .provider-header .sub { font-size: 0.85rem; color: var(--text-dim); }
        .provider-tabs {
            display: flex;
            gap: 8px;
            padding: 12px 32px 0;
            flex-wrap: wrap;
        }
        .provider-tab {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            border-radius: 50px;
            padding: 7px 18px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
        .provider-tab:hover { background: var(--surface-hover); color: var(--text); }
        .provider-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .load-more-wrap { text-align: center; padding: 8px 32px 32px; }
        nav .search-wrap {
            margin-left: auto;
            position: relative;
        }
        nav .search-wrap input {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50px;
            color: var(--text);
            padding: 9px 16px 9px 38px;
            font-size: 0.9rem;
            width: 240px;
            transition: all .2s;
            outline: none;
        }
        nav .search-wrap input:focus {
            border-color: var(--primary);
            width: 320px;
        }
        nav .search-wrap svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: var(--text-dim);
        }

        /* Main container */
        #app { padding-top: 64px; min-height: 100vh; }

        /* Hero */
        .hero {
            position: relative;
            height: 70vh;
            min-height: 400px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .hero-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center top;
        }
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(10,10,15,0.9) 0%, rgba(10,10,15,0.4) 60%, transparent 100%),
                        linear-gradient(0deg, rgba(10,10,15,1) 0%, transparent 50%);
        }
        .hero-content {
            position: absolute;
            bottom: 40px;
            left: 32px;
            right: 32px;
            max-width: 600px;
        }
        .hero-content h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 12px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
            letter-spacing: -1px;
        }
        .hero-content p {
            font-size: 1rem;
            color: var(--text-dim);
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .hero-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .hero-btn:hover { background: var(--primary-hover); }

        /* Sections */
        .section {
            padding: 20px 32px;
        }
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        /* Card Grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
            position: relative;
        }
        .card:hover {
            transform: scale(1.04);
            box-shadow: var(--shadow);
            z-index: 10;
        }
        .card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
        }
        .card-body {
            padding: 8px 10px 12px;
        }
        .card-body .title {
            font-size: 0.88rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-body .meta {
            font-size: 0.78rem;
            color: var(--text-dim);
            margin-top: 2px;
        }
        .card .rating-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.75);
            color: #ffd700;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Detail Page */
        .detail-header {
            position: relative;
            min-height: 400px;
            overflow: hidden;
        }
        .detail-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center top;
            filter: blur(2px);
        }
        .detail-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0.6) 50%, transparent 100%),
                        linear-gradient(0deg, var(--bg) 0%, transparent 40%);
        }
        .detail-content {
            position: relative;
            display: flex;
            gap: 28px;
            padding: 40px 32px;
            z-index: 1;
        }
        .detail-poster {
            flex-shrink: 0;
            width: 200px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .detail-poster img {
            width: 100%;
            border-radius: var(--radius);
            display: block;
        }
        .detail-info { flex: 1; max-width: 700px; padding-top: 20px; }
        .detail-info h1 {
            font-size: 2.4rem;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .detail-info .tagline {
            font-style: italic;
            color: var(--text-dim);
            margin-bottom: 12px;
        }
        .detail-info .meta-row {
            display: flex;
            gap: 16px;
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .detail-info .meta-row span { display: flex; align-items: center; gap: 4px; }
        .detail-info .meta-row .rating { color: #ffd700; font-weight: 700; }
        .detail-info .genres { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .detail-info .genre-tag {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 4px 14px;
            font-size: 0.8rem;
        }
        .detail-info .overview {
            font-size: 0.95rem;
            color: var(--text-dim);
            line-height: 1.7;
            margin-bottom: 20px;
        }
        .play-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 36px;
            border-radius: 6px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .play-btn:hover { background: var(--primary-hover); }

        /* Cast */
        .cast-section { padding: 0 32px 24px; }
        .cast-grid {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding-bottom: 12px;
        }
        .cast-card {
            flex-shrink: 0;
            width: 100px;
            text-align: center;
        }
        .cast-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 6px;
        }
        .cast-card .name { font-size: 0.8rem; font-weight: 600; }
        .cast-card .char { font-size: 0.72rem; color: var(--text-dim); }

        /* Player */
        .player-wrap {
            position: relative;
            padding: 64px 0 0;
            background: var(--bg);
        }
        .player-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }
        .player-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .player-back {
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 12px;
            display: inline-block;
        }
        .player-back:hover { color: var(--text); }
        .player-frame-wrap {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .player-frame-wrap::before {
            content: '';
            display: block;
            padding-top: 56.25%;
        }
        #playerFrame {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        /* Season / Episode selector for TV */
        .season-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .season-selector select {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .episode-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 12px 14px;
            cursor: pointer;
            transition: background .2s;
            border: 2px solid transparent;
        }
        .episode-card:hover { background: var(--surface-hover); }
        .episode-card.active { border-color: var(--primary); }
        .episode-card .ep-num { font-size: 0.75rem; color: var(--primary); font-weight: 700; }
        .episode-card .ep-name { font-size: 0.88rem; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .episode-card .ep-overview { font-size: 0.76rem; color: var(--text-dim); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Server selector */
        .server-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .server-label {
            font-size: 0.85rem;
            color: var(--text-dim);
            font-weight: 600;
        }
        .server-btn {
            background: var(--surface);
            color: var(--text-dim);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }
        .server-btn:hover { background: var(--surface-hover); color: var(--text); }
        .server-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .external-btn { color: var(--text-dim); }
        .player-hint {
            font-size: 0.82rem;
            color: var(--text-dim);
            margin-top: 10px;
            padding: 8px 12px;
            background: var(--surface);
            border-radius: 6px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }
        .loading-spinner {
            width: 36px; height: 36px;
            border: 3px solid var(--surface);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 24px 24px;
            color: var(--text-dim);
            font-size: 0.82rem;
            border-top: 1px solid var(--border);
        }
        footer a { color: var(--primary); text-decoration: none; }

        /* Responsive */
        @media (max-width: 768px) {
            nav { padding: 12px 14px; gap: 10px; flex-wrap: wrap; }
            nav .nav-links {
                display: none;
                order: 3;
                width: 100%;
                flex-direction: column;
                gap: 2px;
                padding-top: 8px;
            }
            nav .nav-links.mobile-open { display: flex; }
            nav .nav-links a { padding: 8px 2px; font-size: 0.95rem; }
            .mobile-menu-btn { display: block; order: 2; margin-left: auto; }
            nav .search-wrap { margin-left: 0; flex: 1; }
            nav .search-wrap input { width: 100%; }
            nav .search-wrap input:focus { width: 100%; }
            .nav-dropdown { position: static; }
            .dd-menu {
                position: static;
                min-width: 0;
                width: 100%;
                max-height: 45vh;
                margin-top: 4px;
            }
            .dd-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .provider-header { padding: 18px 14px 4px; }
            .provider-header img { width: 42px; height: 42px; }
            .provider-header h1 { font-size: 1.25rem; }
            .provider-tabs { padding: 10px 14px 0; }
            .load-more-wrap { padding: 8px 14px 28px; }
            .section { padding: 16px 14px; }
            .hero { height: 50vh; min-height: 300px; }
            .hero-content { left: 16px; right: 16px; bottom: 24px; }
            .hero-content h1 { font-size: 1.8rem; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
            .detail-content { flex-direction: column; padding: 20px 16px; }
            .detail-poster { width: 140px; margin: 0 auto; }
            .detail-info { text-align: center; padding-top: 0; }
            .detail-info h1 { font-size: 1.6rem; }
            .detail-info .genres { justify-content: center; }
            .cast-section { padding: 0 16px 20px; }
            .player-container { padding: 12px; }
        }
        .placeholder-poster {
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        /* Section head with "see all" link */
        .section-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
        }
        .section-more {
            color: var(--text-dim);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .section-more:hover { color: var(--primary); }

        /* Sort select */
        .sort-select {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 7px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            margin-left: auto;
        }
        .sort-select:focus { border-color: var(--primary); }
        @media (max-width: 768px) {
            .sort-select { margin-left: 0; width: 100%; }
        }

        /* About page */
        .about-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            box-shadow: var(--shadow);
        }
        .about-brand {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--primary);
            text-align: center;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .about-lead { font-size: 0.98rem; color: var(--text-dim); margin-bottom: 22px; }
        .about-lead strong { color: var(--text); }
        .about-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
        }
        .about-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            font-size: 0.86rem;
            color: var(--text-dim);
            line-height: 1.5;
        }
        .about-item span { font-size: 1.4rem; line-height: 1; }
        .about-item b { color: var(--text); }
        .about-foot {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.86rem;
            color: var(--text-dim);
        }
        .about-foot b { color: var(--text); }
    </style>
</head>
<body>

<nav>
    <div class="logo" onclick="navigate('home')">N</div>
    <div class="nav-links">
        <a id="nav-home" class="active" onclick="navigate('home')">Beranda</a>
        <a id="nav-latest" onclick="navigate('latest')">Terbaru</a>
        <a id="nav-movie" onclick="navigate('movie')">Film</a>
        <a id="nav-tv" onclick="navigate('tv')">Series</a>
        <a id="nav-trending" onclick="navigate('trending')">Trending</a>
        <div class="nav-dropdown">
            <a id="nav-provider" class="dd-toggle">Platform ▾</a>
            <div class="dd-menu" id="providerMenu"></div>
        </div>
        <a id="nav-about" onclick="navigate('about')">About</a>
    </div>
    <button class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Menu">☰</button>
    <div class="search-wrap">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="searchInput" placeholder="Cari film atau series..." oninput="handleSearch(event)">
    </div>
</nav>

<div id="app"></div>

<footer>
    <p><strong>Nonthon</strong> — Streaming tanpa iklan. Source: TMDB + vidbox.vc</p>
    <p style="margin-top:6px; font-size:0.76rem;">Untuk pakai pribadi. Metadata dari TMDB, video dari vidbox.vc.</p>
    <p style="margin-top:10px; font-size:0.8rem; font-weight:700; letter-spacing:1px; color:var(--primary);">CREATED BY NxrHunt Labs</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const TMDB_API = 'https://api.themoviedb.org/3';
const TMDB_KEY = '8265bd1679663a7ea12ac168da84d2e8'; // public TMDB demo key
const TMDB_IMG = 'https://image.tmdb.org/t/p/w500';

// ===== API =====
async function tmdb(path, params = {}) {
    const url = new URL(TMDB_API + path);
    url.searchParams.set('api_key', TMDB_KEY);
    url.searchParams.set('language', 'id-ID');
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
    try {
        const r = await fetch(url);
        if (!r.ok) throw new Error('TMDB ' + r.status);
        return await r.json();
    } catch(e) {
        // fallback English
        url.searchParams.set('language', 'en-US');
        const r2 = await fetch(url);
        return await r2.json();
    }
}

// ===== Navigation =====
function navigate(view, data) {
    currentView = view;
    window.scrollTo(0, 0);
    closeProviderMenu();
    document.querySelector('.nav-links')?.classList.remove('mobile-open');

    // nav active
    document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
    const navMap = { home: 'nav-home', latest: 'nav-latest', movie: 'nav-movie', tv: 'nav-tv', trending: 'nav-trending', provider: 'nav-provider', about: 'nav-about' };
    if (navMap[view]) document.getElementById(navMap[view])?.classList.add('active');

    switch(view) {
        case 'home': renderHome(); break;
        case 'latest': renderLatest(data); break;
        case 'movie': renderMovieList(); break;
        case 'tv': renderTVList(); break;
        case 'trending': renderTrending(data); break;
        case 'search': renderSearch(data); break;
        case 'detail': renderDetail(data); break;
        case 'player': renderPlayer(data); break;
        case 'provider': renderProvider(data); break;
        case 'about': renderAbout(); break;
    }
}

async function renderProvider({id, tab, page}) {
    const p = PROVIDER_MAP[id];
    if (!p) return navigate('home');

    const isNewProvider = providerState.id !== id;
    providerState.id = id;
    providerState.tab = tab || (isNewProvider ? 'movie' : providerState.tab);
    providerState.page = page || 1;
    if (providerState.page === 1) providerState.results = [];

    // mark active in dropdown
    document.querySelectorAll('.dd-item').forEach(el =>
        el.classList.toggle('active', el.dataset.pid === String(id)));

    const app = document.getElementById('app');
    const kind = providerState.tab === 'tv' ? 'tv' : 'movie';

    if (providerState.page === 1) {
        app.innerHTML = `
            <div class="provider-header">
                <img src="${TMDB_LOGO + p.logo}" alt="${p.name}" onerror="this.style.display='none'">
                <div>
                    <h1>${p.name}</h1>
                    <div class="sub" id="providerCount">Memuat katalog...</div>
                </div>
            </div>
            <div class="provider-tabs">
                <button class="provider-tab ${kind==='movie'?'active':''}" onclick="navigate('provider',{id:${id},tab:'movie'})">🎬 Film</button>
                <button class="provider-tab ${kind==='tv'?'active':''}" onclick="navigate('provider',{id:${id},tab:'tv'})">📺 Series</button>
            </div>
            <div class="section">
                <div class="card-grid" id="providerGrid"></div>
                <div class="loading" id="providerLoading"><div class="loading-spinner"></div>Memuat...</div>
            </div>
            <div class="load-more-wrap" id="loadMoreWrap"></div>
        `;
    } else {
        document.getElementById('loadMoreWrap').innerHTML =
            `<div class="loading"><div class="loading-spinner"></div></div>`;
    }

    try {
        // Skip TV tab entirely for providers with no series catalog
        if (kind === 'tv' && NO_TV.has(id)) {
            document.getElementById('providerLoading')?.remove();
            const g = document.getElementById('providerGrid');
            if (g) g.innerHTML = `<div style="color:var(--text-dim);grid-column:1/-1;padding:20px 0;">Platform ini tidak punya katalog series. Coba tab Film.</div>`;
            const c = document.getElementById('providerCount');
            if (c) c.textContent = 'Hanya katalog film';
            return;
        }

        // Region ID for providers with local coverage, otherwise US (much bigger catalog)
        const region = REGION_ID_OK.has(id) ? 'ID' : 'US';
        let data = await tmdb(`/discover/${kind}`, {
            watch_region: region,
            with_watch_providers: id,
            sort_by: 'popularity.desc',
            page: providerState.page,
        });

        // Fallback to US if the ID region returns nothing
        if ((!data.results || data.results.length === 0) && region === 'ID') {
            data = await tmdb(`/discover/${kind}`, {
                watch_region: 'US',
                with_watch_providers: id,
                sort_by: 'popularity.desc',
                page: providerState.page,
            });
        }

        const items = (data.results || []).map(r => { r.media_type = kind; return r; });
        providerState.results = providerState.results.concat(items);
        providerState.total = data.total_results || 0;

        document.getElementById('providerLoading')?.remove();
        renderCards('providerGrid', providerState.results);

        const countEl = document.getElementById('providerCount');
        if (countEl) {
            countEl.textContent = providerState.total
                ? `${providerState.total.toLocaleString('id-ID')} judul • ${kind === 'tv' ? 'Series' : 'Film'}`
                : 'Katalog tidak tersedia';
        }

        const wrap = document.getElementById('loadMoreWrap');
        if (wrap) {
            const hasMore = providerState.page < (data.total_pages || 1);
            wrap.innerHTML = hasMore
                ? `<button class="hero-btn" style="background:var(--surface);font-size:0.9rem;"
                     onclick="navigate('provider',{id:${id},tab:'${kind}',page:${providerState.page + 1}})">
                     Muat Lebih Banyak
                   </button>`
                : (providerState.results.length ? `<div style="color:var(--text-dim);font-size:0.82rem;">Semua judul sudah dimuat</div>` : '');
        }

        if (providerState.results.length === 0) {
            document.getElementById('providerGrid').innerHTML =
                `<div style="color:var(--text-dim);grid-column:1/-1;padding:20px 0;">
                   Tidak ada ${kind === 'tv' ? 'series' : 'film'} untuk platform ini. Coba tab lainnya.
                 </div>`;
        }
    } catch(e) {
        document.getElementById('providerLoading')?.remove();
        const wrap = document.getElementById('loadMoreWrap');
        if (wrap) wrap.innerHTML = `<div style="color:var(--text-dim)">❌ ${e.message}</div>`;
    }
}

const SORT_OPTIONS = [
    { key: 'baru',    label: '🆕 Rilis Terbaru' },
    { key: 'trending',label: '🔥 Baru & Trending (90 hari)' },
    { key: 'populer', label: '⭐ Paling Populer' },
    { key: 'rating',  label: '🏆 Rating Tertinggi' },
    { key: 'lama',    label: '📼 Rilis Terlama' },
];

let latestState = { kind: 'movie', sort: 'baru', page: 1, results: [], total: 0, pages: 1 };

function todayISO() { return new Date().toISOString().slice(0, 10); }
function daysAgoISO(n) {
    const d = new Date(Date.now() - n * 86400000);
    return d.toISOString().slice(0, 10);
}

function buildDiscoverParams(kind, sort, page) {
    const dateField = kind === 'movie' ? 'primary_release_date' : 'first_air_date';
    const p = { page, include_adult: false };
    switch (sort) {
        case 'baru':
            p.sort_by = `${dateField}.desc`;
            p[`${dateField}.lte`] = todayISO();
            p['vote_count.gte'] = 1;
            break;
        case 'trending':
            p.sort_by = 'popularity.desc';
            p[`${dateField}.gte`] = daysAgoISO(90);
            p[`${dateField}.lte`] = todayISO();
            break;
        case 'populer':
            p.sort_by = 'popularity.desc';
            break;
        case 'rating':
            p.sort_by = 'vote_average.desc';
            p['vote_count.gte'] = kind === 'movie' ? 500 : 150;
            break;
        case 'lama':
            p.sort_by = `${dateField}.asc`;
            p[`${dateField}.gte`] = '1900-01-01';
            p['vote_count.gte'] = 10;
            break;
    }
    return p;
}

    try {

            .map(r => { r.media_type = kind; return r; });

        document.getElementById('latestLoading')?.remove();
        renderCards('latestGrid', latestState.results);

        const c = document.getElementById('latestCount');
        if (c) {
            const sortLabel = (SORT_OPTIONS.find(o => o.key === sort) || {}).label || '';
            c.textContent = `${latestState.total.toLocaleString('id-ID')} judul • ${sortLabel} • diperbarui ${todayISO()}`;

        }
    } catch (e) {
        document.getElementById('latestLoading')?.remove();
        const more = document.getElementById('latestMore');
        if (more) more.innerHTML = `<div style="color:var(--text-dim)">❌ ${e.message}</div>`;
    }
}

function renderCards(elId, items) {
    const el = document.getElementById(elId);
    if (!el) return;
    el.innerHTML = items.map(item => {
        const type = item.media_type || (item.title ? 'movie' : 'tv');
        const title = item.title || item.name;
        const poster = item.poster_path ? TMDB_IMG + item.poster_path : '';
        const rating = item.vote_average ? item.vote_average.toFixed(1) : '';
        const date = item.release_date || item.first_air_date || '';
        const year = date ? date.substring(0,4) : '';

        return `
            <div class="card" onclick="navigate('detail', {type:'${type}', id:${item.id}})">
                ${rating ? `<div class="rating-badge">★ ${rating}</div>` : ''}
                ${poster
                    ? `<img src="${poster}" alt="${title}" loading="lazy">`
                    : `<div class="placeholder-poster" style="aspect-ratio:2/3">${title}</div>`
                }
                <div class="card-body">
                    <div class="title">${title}</div>
                    <div class="meta">${year}${type === 'tv' ? ' • Series' : ''}</div>
                </div>
            </div>
        `;

async function renderSearch(query) {

            ...tvs.results.map(t => { t.media_type = 'tv'; return t; })

    const app = document.getElementById('app');
    app.innerHTML = `<div class="loading"><div class="loading-spinner"></div>Memuat detail...</div>`;
    currentState = { type, id, season, episode };

    try {
        const data = await tmdb(`/${type}/${id}`, { append_to_response: 'credits,similar,recommendations,videos' });

        const title = data.title || data.name;
        const backdrop = data.backdrop_path ? TMDB_IMG_ORIG + data.backdrop_path : '';
        const poster = data.poster_path ? TMDB_IMG + data.poster_path : '';
        const year = (data.release_date || data.first_air_date || '').substring(0,4);
        const rating = data.vote_average ? data.vote_average.toFixed(1) : 'N/A';
        const runtime = data.runtime || (data.episode_run_time && data.episode_run_time[0]) || null;
        const genres = (data.genres || []).map(g => `<span class="genre-tag">${g.name}</span>`).join('');

        let html = `
            <div class="detail-header">
                ${backdrop ? `<div class="detail-bg" style="background-image:url('${backdrop}')"></div>` : ''}
                <div class="detail-overlay"></div>
                <div class="detail-content">
                    ${poster ? `<div class="detail-poster"><img src="${poster}" alt="${title}"></div>` : ''}
                    <div class="detail-info">
                        <h1>${title}</h1>
                        ${data.tagline ? `<p class="tagline">"${data.tagline}"</p>` : ''}
                        <div class="meta-row">
                            <span class="rating">★ ${rating}</span>
                            ${year ? `<span>📅 ${year}</span>` : ''}
                            ${runtime ? `<span>⏱ ${runtime} menit</span>` : ''}
                            ${type === 'tv' ? `<span>📺 ${data.number_of_seasons} musim</span>` : ''}
                        </div>
                        <div class="genres">${genres}</div>
                        <p class="overview">${data.overview || 'Tidak ada sinopsis.'}</p>
                        <button class="play-btn" onclick="startPlayback()">▶ Nonton</button>
                    </div>
                </div>
            </div>
        `;

        // TV: season/episode selector
        if (type === 'tv' && data.seasons && data.seasons.length > 0) {
            const validSeasons = data.seasons.filter(s => s.season_number > 0 || data.seasons.length === 1);
            html += `
                <div class="section" id="tv-seasons">
                    <div class="section-title">Episodes</div>
                    <div class="season-selector">
                        <select id="seasonSelect" onchange="loadSeason(${id}, this.value)">
                            ${validSeasons.map(s => `<option value="${s.season_number}" ${parseInt(season||1)===s.season_number?'selected':''}>Musim ${s.season_number} (${s.episode_count} eps)</option>`).join('')}
                        </select>
                    </div>
                    <div class="episode-grid" id="episodeGrid"></div>
                </div>
            `;
        }

        // Cast
        if (data.credits && data.credits.cast && data.credits.cast.length > 0) {
            const cast = data.credits.cast.slice(0, 12);
            html += `
                <div class="cast-section">
                    <div class="section-title">Pemeran</div>
                    <div class="cast-grid">
                        ${cast.map(c => `
                            <div class="cast-card">
                                ${c.profile_path ? `<img src="${TMDB_IMG_SM + c.profile_path}" alt="${c.name}">` : `<div style="width:100px;height:100px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:2rem;margin-bottom:6px;">👤</div>`}
                                <div class="name">${c.name}</div>
                                <div class="char">${c.character}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Similar / Recommendations
        const recs = (data.recommendations && data.recommendations.results) || (data.similar && data.similar.results) || [];
        if (recs.length > 0) {
            html += `<div class="section"><div class="section-title">📌 Rekomendasi</div><div class="card-grid" id="grid-recs"></div></div>`;
        }

        app.innerHTML = html;

        if (recs.length > 0) {
            const recItems = recs.slice(0, 12).map(r => { r.media_type = type; return r; });
            renderCards('grid-recs', recItems);
        }

        // Load episodes for TV
        if (type === 'tv' && season) {
            loadSeason(id, season);
        }
    } catch(e) {
        app.innerHTML = `<div class="loading">❌ ${e.message}</div>`;
    }
}

async function loadSeason(id, seasonNum) {
    currentState.season = parseInt(seasonNum);
    const grid = document.getElementById('episodeGrid');
    if (!grid) return;
    grid.innerHTML = `<div class="loading"><div class="loading-spinner"></div></div>`;
    try {
        const data = await tmdb(`/tv/${id}/season/${seasonNum}`);
        const episodes = data.episodes || [];
        grid.innerHTML = episodes.map(ep => `
            <div class="episode-card ${currentState.episode === ep.episode_number ? 'active' : ''}" onclick="playEpisode(${id}, ${seasonNum}, ${ep.episode_number})">
                <div class="ep-num">E${ep.episode_number}</div>
                <div class="ep-name">${ep.name || 'Episode ' + ep.episode_number}</div>
                ${ep.overview ? `<div class="ep-overview">${ep.overview}</div>` : ''}
            </div>
        `).join('');
    } catch(e) {
        grid.innerHTML = `<div style="color:var(--text-dim)">Gagal memuat episode</div>`;
    }
}

let _hls = null;
let _streamData = null;
let _subtitleList = [];

async function loadStream(type, id, season, episode) {
    const loading = document.getElementById('player-loading');
    const area = document.getElementById('player-area');
    const errDiv = document.getElementById('player-error');
    const controls = document.getElementById('player-controls');

    try {
        const params = new URLSearchParams({ type, id });
        if (type === 'tv') {
            params.set('s', season || 1);
            params.set('e', episode || 1);
        }
        
        const resp = await fetch(`/api/stream?${params}`);
        _streamData = await resp.json();

        if (!_streamData.success) throw new Error(_streamData.error || 'Unknown error');

        loading.style.display = 'none';
        area.style.display = 'block';
        controls.style.display = 'flex';

        const video = document.getElementById('video');
        const streamUrl = _streamData.streamUrl;

        // Setup HLS.js with ad-stripping + fast start
        if (window.Hls && Hls.isSupported()) {
            if (_hls) { _hls.destroy(); }
            _hls = new Hls({
                enableWorker: true,
                lowLatencyMode: false,
                backBufferLength: 30,
                maxBufferLength: 30,
                maxMaxBufferLength: 60,
                startLevel: -1,
                maxBufferSize: 60 * 1000 * 1000,
                maxBufferHole: 0.5,
                abrEwmaDefaultEstimate: 1000000,
                startFragPrefetch: true,
            });
            _hls.loadSource(streamUrl);
            _hls.attachMedia(video);
            
            // Ad stripping: skip fragments from known ad CDNs
            const adDomains = ['tiktokcdn', 'ad-site-i18n', 'doubleclick', 'googleads', 'googlesyndication', 'popads', 'ad-site-sign'];
            _hls.on(Hls.Events.FRAG_LOADING, (event, data) => {
                const url = data.frag.url || '';
                if (adDomains.some(d => url.includes(d))) {
                    // Skip this ad fragment by advancing to next
                    console.log('Ad skipped:', url.substring(0, 60));
                    data.frag.loader = { destroy: () => {}, load: () => {} };
                }
            });
            
            _hls.on(Hls.Events.MANIFEST_PARSED, (e, data) => {
                // Populate quality selector
                const qSel = document.getElementById('qualitySelect');
                if (qSel && data.levels.length > 1) {
                    qSel.innerHTML = '<option value="-1">Auto</option>' +
                        data.levels.map((l, i) => 
                            `<option value="${i}">${l.height || '?'}p (${Math.round(l.bitrate/1000)}kbps)</option>`
                        ).join('');
                    qSel.style.display = 'inline-block';
                }
                video.play().catch(()=>{});
            });
            _hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    console.error('HLS fatal:', data);
                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                        setTimeout(() => _hls.startLoad(), 1000);
                    } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                        _hls.recoverMediaError();
                    }
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.play().catch(()=>{});
        } else {
            throw new Error('HLS not supported');
        }

        // Setup subtitle selector — multi-language from OpenSubtitles
        loadSubtitles(type, id, season, episode);

    } catch (err) {
        console.error('Stream error:', err);
        loading.style.display = 'none';
        area.style.display = 'none';
        controls.style.display = 'none';
        errDiv.style.display = 'block';
    }
}

// ===== Subtitles (multi-language) =====
async function loadSubtitles(type, id, season, episode) {
    const subSel = document.getElementById('subSelect');
    if (!subSel) return;

    // Embedded tracks the stream provider itself shipped
    const embedded = (_streamData?.subtitles || []).map(s => ({ ...s, src: 'stream' }));

    subSel.innerHTML = '<option value="">Memuat subtitle...</option>';
    subSel.style.display = 'inline-block';
    subSel.disabled = true;

    let online = [];
    try {
        const params = new URLSearchParams({ type, id });
        if (type === 'tv') {
            params.set('s', season || 1);
            params.set('e', episode || 1);
        }
        const resp = await fetch(`/api/subs?${params}`);
        const data = await resp.json();
        if (data.success) online = (data.subtitles || []).map(s => ({ ...s, src: 'os' }));
    } catch (e) {
        console.warn('Subtitle fetch failed:', e.message);
    }

    const all = [...embedded, ...online];
    subSel.disabled = false;

    if (all.length === 0) {
        subSel.innerHTML = '<option value="">Subtitle tidak tersedia</option>';
        return;
    }

    // Route every subtitle through /api/sub (SRT→VTT + CORS)
    _subtitleList = all.map((s, i) => ({
        ...s,
        idx: i,
        proxied: `/api/sub?url=${encodeURIComponent(s.url)}`,
    }));

    subSel.innerHTML =
        `<option value="">CC Off</option>` +
        _subtitleList.map(s => `<option value="${s.idx}">${s.label}</option>`).join('');

    // Auto-pick Indonesian, then Malay, then English
    const pick = _subtitleList.find(s => s.lang === 'ind' || s.lang === 'id')
        || _subtitleList.find(s => s.lang === 'may' || s.lang === 'msa')
        || _subtitleList.find(s => s.lang === 'eng' || s.lang === 'en');

    if (pick) {
        subSel.value = String(pick.idx);
        applySubtitle(pick.idx);
    }
}

function setSubtitle(idxStr) {
    const video = document.getElementById('video');
    if (!video) return;

    video.querySelectorAll('track').forEach(t => t.remove());
    for (let i = 0; i < video.textTracks.length; i++) video.textTracks[i].mode = 'disabled';
    if (_hls) _hls.subtitleTrack = -1;

    if (idxStr === '' || idxStr == null) return; // CC Off
    applySubtitle(parseInt(idxStr, 10));
}

function applySubtitle(idx) {
    const video = document.getElementById('video');
    const sub = _subtitleList[idx];
    if (!video || !sub) return;

    video.querySelectorAll('track').forEach(t => t.remove());

    const track = document.createElement('track');
    track.kind = 'subtitles';
    track.label = sub.label;
    track.srclang = (sub.lang || 'en').slice(0, 2);
    track.src = sub.proxied;
    track.default = true;
    video.appendChild(track);

    track.addEventListener('load', () => { track.track.mode = 'showing'; });
    track.addEventListener('error', () => {
        console.warn('Subtitle failed to load:', sub.label);
    });

    setTimeout(() => {
        for (let i = 0; i < video.textTracks.length; i++) {
            video.textTracks[i].mode = 'showing';
        }
    }, 300);
}

function setQuality(level) {
    if (_hls) {
        _hls.currentLevel = parseInt(level);
    }
}

function retryPlayer() {
    const { type, id, season, episode } = currentState;
    navigate('player', { type, id, season, episode });
}

async function prevEpisode(id, s, e) {
    if (e > 1) navigate('player', { type: 'tv', id, season: s, episode: e - 1 });
}
async function nextEpisode(id, s, e) {
    navigate('player', { type: 'tv', id, season: s, episode: e + 1 });
}

// ===== Init =====
buildProviderMenu();

// Dropdown open/close wiring
document.getElementById('nav-provider')?.addEventListener('click', toggleProviderMenu);
document.addEventListener('click', (e) => {
    if (!e.target.closest('.nav-dropdown')) closeProviderMenu();
});
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeProviderMenu();
});

navigate('home');
</script>
