<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonthon — Nonton Film & Series Gratis</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #13131a;
            --surface-hover: #1c1c26;
            --primary: #e50914;
            --primary-hover: #f6121d;
            --text: #ffffff;
            --text-dim: #a0a0b0;
            --border: #2a2a35;
            --radius: 10px;
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

        /* Navbar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: linear-gradient(180deg, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0.7) 100%);
            backdrop-filter: blur(12px);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        nav .logo {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary);
            cursor: pointer;
            letter-spacing: -0.5px;
            white-space: nowrap;
        }
        nav .nav-links {
            display: flex;
            gap: 20px;
        }
        nav .nav-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            transition: color .2s;
        }
        nav .nav-links a:hover, nav .nav-links a.active { color: var(--text); }

        /* Provider dropdown */
        .nav-dropdown { position: relative; }
        .dd-toggle { user-select: none; }
        .dd-menu {
            display: none;
            position: absolute;
            top: 28px;
            left: -12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 8px;
            min-width: 460px;
            max-height: 70vh;
            overflow-y: auto;
            z-index: 1200;
        }
        .dd-menu.open { display: block; }
        .dd-group-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
            padding: 8px 8px 4px;
            font-weight: 700;
        }
        .dd-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(130px, 1fr));
            gap: 4px;
        }
        .dd-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.84rem;
            color: var(--text-dim);
            transition: background .15s, color .15s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dd-item:hover { background: var(--surface-hover); color: var(--text); }
        .dd-item.active { background: var(--primary); color: #fff; }
        .dd-item img {
            width: 22px; height: 22px;
            border-radius: 5px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--border);
        }
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0 4px;
        }

        /* Provider page header */
        .provider-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 24px 32px 4px;
        }
        .provider-header img {
            width: 54px; height: 54px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: var(--shadow);
        }
        .provider-header h1 { font-size: 1.7rem; font-weight: 800; }
        .provider-header .sub { font-size: 0.85rem; color: var(--text-dim); }
        .provider-tabs {
            display: flex;
            gap: 8px;
            padding: 12px 32px 0;
            flex-wrap: wrap;
        }
        .provider-tab {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            border-radius: 50px;
            padding: 7px 18px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
        .provider-tab:hover { background: var(--surface-hover); color: var(--text); }
        .provider-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .load-more-wrap { text-align: center; padding: 8px 32px 32px; }
        nav .search-wrap {
            margin-left: auto;
            position: relative;
        }
        nav .search-wrap input {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50px;
            color: var(--text);
            padding: 9px 16px 9px 38px;
            font-size: 0.9rem;
            width: 240px;
            transition: all .2s;
            outline: none;
        }
        nav .search-wrap input:focus {
            border-color: var(--primary);
            width: 320px;
        }
        nav .search-wrap svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: var(--text-dim);
        }

        /* Main container */
        #app { padding-top: 64px; min-height: 100vh; }

        /* Hero */
        .hero {
            position: relative;
            height: 70vh;
            min-height: 400px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .hero-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center top;
        }
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(10,10,15,0.9) 0%, rgba(10,10,15,0.4) 60%, transparent 100%),
                        linear-gradient(0deg, rgba(10,10,15,1) 0%, transparent 50%);
        }
        .hero-content {
            position: absolute;
            bottom: 40px;
            left: 32px;
            right: 32px;
            max-width: 600px;
        }
        .hero-content h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 12px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
            letter-spacing: -1px;
        }
        .hero-content p {
            font-size: 1rem;
            color: var(--text-dim);
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .hero-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .hero-btn:hover { background: var(--primary-hover); }

        /* Sections */
        .section {
            padding: 20px 32px;
        }
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        /* Card Grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
            position: relative;
        }
        .card:hover {
            transform: scale(1.04);
            box-shadow: var(--shadow);
            z-index: 10;
        }
        .card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
        }
        .card-body {
            padding: 8px 10px 12px;
        }
        .card-body .title {
            font-size: 0.88rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-body .meta {
            font-size: 0.78rem;
            color: var(--text-dim);
            margin-top: 2px;
        }
        .card .rating-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.75);
            color: #ffd700;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Detail Page */
        .detail-header {
            position: relative;
            min-height: 400px;
            overflow: hidden;
        }
        .detail-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center top;
            filter: blur(2px);
        }
        .detail-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0.6) 50%, transparent 100%),
                        linear-gradient(0deg, var(--bg) 0%, transparent 40%);
        }
        .detail-content {
            position: relative;
            display: flex;
            gap: 28px;
            padding: 40px 32px;
            z-index: 1;
        }
        .detail-poster {
            flex-shrink: 0;
            width: 200px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .detail-poster img {
            width: 100%;
            border-radius: var(--radius);
            display: block;
        }
        .detail-info { flex: 1; max-width: 700px; padding-top: 20px; }
        .detail-info h1 {
            font-size: 2.4rem;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .detail-info .tagline {
            font-style: italic;
            color: var(--text-dim);
            margin-bottom: 12px;
        }
        .detail-info .meta-row {
            display: flex;
            gap: 16px;
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .detail-info .meta-row span { display: flex; align-items: center; gap: 4px; }
        .detail-info .meta-row .rating { color: #ffd700; font-weight: 700; }
        .detail-info .genres { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .detail-info .genre-tag {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 4px 14px;
            font-size: 0.8rem;
        }
        .detail-info .overview {
            font-size: 0.95rem;
            color: var(--text-dim);
            line-height: 1.7;
            margin-bottom: 20px;
        }
        .play-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 36px;
            border-radius: 6px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .play-btn:hover { background: var(--primary-hover); }

        /* Cast */
        .cast-section { padding: 0 32px 24px; }
        .cast-grid {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding-bottom: 12px;
        }
        .cast-card {
            flex-shrink: 0;
            width: 100px;
            text-align: center;
        }
        .cast-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 6px;
        }
        .cast-card .name { font-size: 0.8rem; font-weight: 600; }
        .cast-card .char { font-size: 0.72rem; color: var(--text-dim); }

        /* Player */
        .player-wrap {
            position: relative;
            padding: 64px 0 0;
            background: var(--bg);
        }
        .player-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }
        .player-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .player-back {
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 12px;
            display: inline-block;
        }
        .player-back:hover { color: var(--text); }
        .player-frame-wrap {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .player-frame-wrap::before {
            content: '';
            display: block;
            padding-top: 56.25%;
        }
        #playerFrame {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        /* Season / Episode selector for TV */
        .season-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .season-selector select {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .episode-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 12px 14px;
            cursor: pointer;
            transition: background .2s;
            border: 2px solid transparent;
        }
        .episode-card:hover { background: var(--surface-hover); }
        .episode-card.active { border-color: var(--primary); }
        .episode-card .ep-num { font-size: 0.75rem; color: var(--primary); font-weight: 700; }
        .episode-card .ep-name { font-size: 0.88rem; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .episode-card .ep-overview { font-size: 0.76rem; color: var(--text-dim); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Server selector */
        .server-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .server-label {
            font-size: 0.85rem;
            color: var(--text-dim);
            font-weight: 600;
        }
        .server-btn {
            background: var(--surface);
            color: var(--text-dim);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }
        .server-btn:hover { background: var(--surface-hover); color: var(--text); }
        .server-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .external-btn { color: var(--text-dim); }
        .player-hint {
            font-size: 0.82rem;
            color: var(--text-dim);
            margin-top: 10px;
            padding: 8px 12px;
            background: var(--surface);
            border-radius: 6px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }
        .loading-spinner {
            width: 36px; height: 36px;
            border: 3px solid var(--surface);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 24px 24px;
            color: var(--text-dim);
            font-size: 0.82rem;
            border-top: 1px solid var(--border);
        }
        footer a { color: var(--primary); text-decoration: none; }

        /* Responsive */
        @media (max-width: 768px) {
            nav { padding: 12px 14px; gap: 10px; flex-wrap: wrap; }
            nav .nav-links {
                display: none;
                order: 3;
                width: 100%;
                flex-direction: column;
                gap: 2px;
                padding-top: 8px;
            }
            nav .nav-links.mobile-open { display: flex; }
            nav .nav-links a { padding: 8px 2px; font-size: 0.95rem; }
            .mobile-menu-btn { display: block; order: 2; margin-left: auto; }
            nav .search-wrap { margin-left: 0; flex: 1; }
            nav .search-wrap input { width: 100%; }
            nav .search-wrap input:focus { width: 100%; }
            .nav-dropdown { position: static; }
            .dd-menu {
                position: static;
                min-width: 0;
                width: 100%;
                max-height: 45vh;
                margin-top: 4px;
            }
            .dd-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .provider-header { padding: 18px 14px 4px; }
            .provider-header img { width: 42px; height: 42px; }
            .provider-header h1 { font-size: 1.25rem; }
            .provider-tabs { padding: 10px 14px 0; }
            .load-more-wrap { padding: 8px 14px 28px; }
            .section { padding: 16px 14px; }
            .hero { height: 50vh; min-height: 300px; }
            .hero-content { left: 16px; right: 16px; bottom: 24px; }
            .hero-content h1 { font-size: 1.8rem; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
            .detail-content { flex-direction: column; padding: 20px 16px; }
            .detail-poster { width: 140px; margin: 0 auto; }
            .detail-info { text-align: center; padding-top: 0; }
            .detail-info h1 { font-size: 1.6rem; }
            .detail-info .genres { justify-content: center; }
            .cast-section { padding: 0 16px 20px; }
            .player-container { padding: 12px; }
        }
        .placeholder-poster {
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        /* Section head with "see all" link */
        .section-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
        }
        .section-more {
            color: var(--text-dim);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .section-more:hover { color: var(--primary); }

        /* Sort select */
        .sort-select {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 7px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            margin-left: auto;
        }
        .sort-select:focus { border-color: var(--primary); }
        @media (max-width: 768px) {
            .sort-select { margin-left: 0; width: 100%; }
        }

        /* About page */
        .about-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            box-shadow: var(--shadow);
        }
        .about-brand {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--primary);
            text-align: center;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .about-lead { font-size: 0.98rem; color: var(--text-dim); margin-bottom: 22px; }
        .about-lead strong { color: var(--text); }
        .about-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
        }
        .about-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            font-size: 0.86rem;
            color: var(--text-dim);
            line-height: 1.5;
        }
        .about-item span { font-size: 1.4rem; line-height: 1; }
        .about-item b { color: var(--text); }
        .about-foot {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.86rem;
            color: var(--text-dim);
        }
        .about-foot b { color: var(--text); }

        /* ===== DRACIN ===== */
        .dracin-hero {
            padding: 26px 32px 6px;
            background: linear-gradient(135deg, rgba(229,9,20,.16), transparent 60%);
        }
        .dracin-hero-inner h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -.5px; }
        .dracin-hero-inner p { color: var(--text-dim); font-size: .88rem; margin-top: 6px; max-width: 620px; }

        .dracin-search { display: flex; gap: 6px; margin-left: auto; align-items: center; }
        .dracin-search input {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50px;
            color: var(--text);
            padding: 7px 14px;
            font-size: .85rem;
            outline: none;
            width: 190px;
        }
        .dracin-search input:focus { border-color: var(--primary); }

        /* Portrait 2:3 grid, denser than the movie grid because covers are taller */
        .dracin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
        }
        .dracin-card { cursor: pointer; transition: transform .18s; }
        .dracin-card:hover { transform: translateY(-4px); }
        .dracin-poster {
            position: relative;
            aspect-ratio: 2 / 3;
            border-radius: 12px;
            overflow: hidden;
            background: var(--surface);
            box-shadow: var(--shadow);
        }
        .dracin-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .dracin-poster.noimg::after {
            content: '📱';
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; color: var(--text-dim);
        }
        /* Bottom scrim: these covers have their Chinese title art baked into
           the lower third, so a bare pill sitting on top of it looked like a
           rendering fault. The gradient separates chrome from artwork. */
        .dracin-poster::before {
            content: '';
            position: absolute; left: 0; right: 0; bottom: 0; height: 42%;
            background: linear-gradient(to top, rgba(0,0,0,.82), rgba(0,0,0,0));
            pointer-events: none;
        }
        .dracin-eps {
            position: absolute; top: 8px; left: 8px;
            background: rgba(0,0,0,.78);
            color: #fff; font-size: .7rem; font-weight: 700;
            padding: 3px 8px; border-radius: 50px;
            backdrop-filter: blur(4px);
            /* Guard against a 3-digit count meeting a long source label. */
            max-width: calc(60% - 8px);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .dracin-badge {
            position: absolute; bottom: 8px; left: 8px;
            background: rgba(0,0,0,.6);
            color: #fff; font-size: .66rem; font-weight: 700;
            padding: 3px 7px; border-radius: 5px;
            max-width: calc(100% - 16px);
            backdrop-filter: blur(4px);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        /* Which source a card came from. Only rendered on the mixed "Terbaru"
           feed, where rows come from several hosts and the origin is real
           information rather than the same string on every tile.
           Kept neutral, not brand red: 47 red pills competed with the accent
           colour. Solid dark + hairline border rather than a light translucent
           fill, because a white-ish chip disappeared entirely on high-key
           posters (bright cyan/blue covers). */
        .dracin-srcbadge {
            position: absolute; top: 8px; right: 8px;
            background: rgba(0,0,0,.66);
            border: 1px solid rgba(255,255,255,.22);
            color: rgba(255,255,255,.94);
            font-size: .6rem; font-weight: 700; letter-spacing: .3px;
            padding: 2px 6px; border-radius: 4px;
            backdrop-filter: blur(6px);
            white-space: nowrap;
        }
        .dracin-play {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem; color: #fff;
            background: rgba(0,0,0,.35);
            opacity: 0; transition: opacity .18s;
        }
        .dracin-card:hover .dracin-play { opacity: 1; }
        .dracin-body { padding: 8px 2px 0; }
        .dracin-title {
            font-size: .86rem; font-weight: 600; line-height: 1.35;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.4em;
        }
        .dracin-meta { font-size: .74rem; color: var(--text-dim); margin-top: 3px; }

        .dracin-detail {
            display: flex; gap: 24px;
            padding: 26px 32px;
            align-items: flex-start;
        }
        .dracin-detail-poster {
            width: 200px; flex-shrink: 0;
            border-radius: 14px; overflow: hidden;
            box-shadow: var(--shadow);
            background: var(--surface);
        }
        .dracin-detail-poster img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
        .dracin-detail-info { flex: 1; min-width: 0; }
        .dracin-detail-info h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: 10px; }

        .dracin-ep-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 8px;
        }
        .dracin-ep {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 6px;
            font-size: .78rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: background .15s, border-color .15s;
        }
        .dracin-ep:hover { background: var(--surface-hover); border-color: var(--text-dim); }
        .dracin-ep.active { background: var(--primary); border-color: var(--primary); color: #fff; }

        /* Portrait stage: tall and centered, the way vertical drama is meant to look */
        .dracin-player-wrap { max-width: 1100px; margin: 0 auto; padding: 18px 20px 40px; }
        .dracin-player-top { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; flex-wrap: wrap; }
        .dracin-player-title { font-size: 1.05rem; font-weight: 700; }
        .dracin-stage {
            position: relative;
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,.7);
        }
        .dracin-err {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: rgba(0,0,0,.85);
            color: var(--text-dim);
            font-size: .9rem; text-align: center; padding: 20px;
        }
        .dracin-player-ctrl {
            display: flex; gap: 8px; justify-content: center;
            align-items: center; flex-wrap: wrap;
            margin: 16px auto 8px;
        }
        .dracin-player-ctrl .provider-tab:disabled { opacity: .4; cursor: not-allowed; }

        @media (max-width: 768px) {
            .dracin-hero { padding: 18px 14px 4px; }
            .dracin-hero-inner h1 { font-size: 1.3rem; }
            .dracin-search { margin-left: 0; width: 100%; }
            .dracin-search input { flex: 1; width: auto; }
            .dracin-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
            .dracin-detail { flex-direction: column; padding: 18px 14px; align-items: center; text-align: center; }
            .dracin-detail-poster { width: 150px; }
            .dracin-detail-info .meta-row, .dracin-detail-info .genres { justify-content: center; }
            .dracin-player-wrap { padding: 12px 12px 32px; }
            .dracin-stage { max-width: 100%; border-radius: 12px; }
            .dracin-ep-grid { grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 6px; }
        }
    </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const TMDB_API = 'https://api.themoviedb.org/3';
const TMDB_KEY = '8265bd1679663a7ea12ac168da84d2e8';
const TMDB_IMG = 'https://image.tmdb.org/t/p/w500';
const TMDB_IMG_ORIG = 'https://image.tmdb.org/t/p/original';
const TMDB_IMG_SM = 'https://image.tmdb.org/t/p/w300';

let searchTimer = null;
let currentView = 'home';
let currentState = null;

// ===== Streaming platform catalogs (watch_provider ids) =====
const PROVIDERS = [
    { group: 'Utama', items: [
        { id: 8,    name: 'Netflix',        logo: '/pbpMk2JmcoNnQwx5JGpXngfoWtp.jpg' },

        { id: 10,   name: 'Amazon Video',   logo: '/qR6FKvnPBx2O37FDg8PNM7efwF3.jpg' },
        { id: 7,    name: 'Fandango',       logo: '/oIXE9vJdkilIxCLAtlbtiqewgvn.jpg' },
        { id: 190,  name: 'Curiosity',      logo: '/oR1aNm1Qu9jQBkW4VrGPWhqbC3P.jpg' },
    ]},
];
const PROVIDER_MAP = {};
PROVIDERS.forEach(g => g.items.forEach(p => { PROVIDER_MAP[p.id] = p; }));
const TMDB_LOGO = 'https://image.tmdb.org/t/p/w92';

// Verified via TMDB /discover: these providers return real results for watch_region=ID.
// Everything else queries US directly (much larger catalog); ID→US fallback also runs at runtime.
const REGION_ID_OK = new Set([8, 1899, 283, 350, 11, 538]);

// Verified empty: TMDB has no series catalog for these provider IDs in any region
const NO_TV = new Set([638]);

let providerState = { id: null, tab: 'movie', sort: 'populer', page: 1, results: [], total: 0 };

// ===== API =====
async function tmdb(path, params = {}) {
    const url = new URL(TMDB_API + path);
    url.searchParams.set('api_key', TMDB_KEY);
    url.searchParams.set('language', 'id-ID');
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
    try {
        const r = await fetch(url);
        if (!r.ok) throw new Error('TMDB ' + r.status);
        return await r.json();
    } catch(e) {
        // fallback English
        url.searchParams.set('language', 'en-US');
        const r2 = await fetch(url);
        return await r2.json();
    }
}

// ===== Navigation =====
function navigate(view, data) {
    currentView = view;
    window.scrollTo(0, 0);
    closeProviderMenu();
    document.querySelector('.nav-links')?.classList.remove('mobile-open');

    // nav active
    document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
    const navMap = { home: 'nav-home', latest: 'nav-latest', movie: 'nav-movie', tv: 'nav-tv', dracin: 'nav-dracin', dracinDetail: 'nav-dracin', dracinPlayer: 'nav-dracin', nxr: 'nav-nxr', nxrDetail: 'nav-nxr', nxrPlayer: 'nav-nxr', trending: 'nav-trending', provider: 'nav-provider', about: 'nav-about' };
    if (navMap[view]) document.getElementById(navMap[view])?.classList.add('active');

    switch(view) {
        case 'home': renderHome(); break;
        case 'latest': renderLatest(data); break;
        case 'movie': renderMovieList(); break;
        case 'tv': renderTVList(); break;
        case 'dracin': renderDracin(data); break;
        case 'dracinDetail': renderDracinDetail(data); break;
        case 'dracinPlayer': renderDracinPlayer(data); break;
        case 'nxr': renderNxr(data); break;
        case 'nxrDetail': renderNxrDetail(data); break;
        case 'nxrPlayer': renderNxrPlayer(data); break;
        case 'trending': renderTrending(data); break;
        case 'search': renderSearch(data); break;
        case 'detail': renderDetail(data); break;
        case 'player': renderPlayer(data); break;
        case 'provider': renderProvider(data); break;
        case 'about': renderAbout(); break;
    }
}

// ===== Provider dropdown =====
function buildProviderMenu() {
    const menu = document.getElementById('providerMenu');
    if (!menu) return;
    menu.innerHTML = PROVIDERS.map(g => `
        <div class="dd-group-title">${g.group}</div>
        <div class="dd-grid">
            ${g.items.map(p => `
                <div class="dd-item" data-pid="${p.id}" onclick="navigate('provider', {id:${p.id}})">
                    <img src="${TMDB_LOGO + p.logo}" alt="${p.name}" loading="lazy"
                         onerror="this.style.visibility='hidden'">
                    <span>${p.name}</span>
                </div>
            `).join('')}
        </div>
    `).join('');
}

function toggleProviderMenu(e) {
    if (e) e.stopPropagation();
    document.getElementById('providerMenu')?.classList.toggle('open');
}
function closeProviderMenu() {
    document.getElementById('providerMenu')?.classList.remove('open');
}
function toggleMobileMenu() {
    document.querySelector('.nav-links')?.classList.toggle('mobile-open');
}

// ===== Provider page =====
async function renderProvider({id, tab, page, sort}) {
    const p = PROVIDER_MAP[id];
    if (!p) return navigate('home');

    const isNewProvider = providerState.id !== id;
    providerState.id = id;
    providerState.tab = tab || (isNewProvider ? 'movie' : providerState.tab);
    // Reset to default sort when switching platform; otherwise keep the
    // chosen filter as the user pages / flips Film<->Series.
    providerState.sort = sort || (isNewProvider ? 'populer' : providerState.sort);
    providerState.page = page || 1;
    if (providerState.page === 1) providerState.results = [];

    // mark active in dropdown
    document.querySelectorAll('.dd-item').forEach(el =>
        el.classList.toggle('active', el.dataset.pid === String(id)));

    const app = document.getElementById('app');
    const kind = providerState.tab === 'tv' ? 'tv' : 'movie';
    const sortKey = providerState.sort;

    if (providerState.page === 1) {
        app.innerHTML = `
            <div class="provider-header">
                <img src="${TMDB_LOGO + p.logo}" alt="${p.name}" onerror="this.style.display='none'">
                <div>
                    <h1>${p.name}</h1>
                    <div class="sub" id="providerCount">Memuat katalog...</div>
                </div>
            </div>
            <div class="provider-tabs">
                <button class="provider-tab ${kind==='movie'?'active':''}" onclick="navigate('provider',{id:${id},tab:'movie',sort:'${sortKey}'})">🎬 Film</button>
                <button class="provider-tab ${kind==='tv'?'active':''}" onclick="navigate('provider',{id:${id},tab:'tv',sort:'${sortKey}'})">📺 Series</button>
                <select class="sort-select" onchange="navigate('provider',{id:${id},tab:'${kind}',sort:this.value})">
                    ${SORT_OPTIONS.map(o => `<option value="${o.key}" ${o.key === sortKey ? 'selected' : ''}>${o.label}</option>`).join('')}
                </select>
            </div>
            <div class="section">
                <div class="card-grid" id="providerGrid"></div>
                <div class="loading" id="providerLoading"><div class="loading-spinner"></div>Memuat...</div>
            </div>
            <div class="load-more-wrap" id="loadMoreWrap"></div>
        `;
    } else {
        document.getElementById('loadMoreWrap').innerHTML =
            `<div class="loading"><div class="loading-spinner"></div></div>`;
    }

    try {
        // Skip TV tab entirely for providers with no series catalog
        if (kind === 'tv' && NO_TV.has(id)) {
            document.getElementById('providerLoading')?.remove();
            const g = document.getElementById('providerGrid');
            if (g) g.innerHTML = `<div style="color:var(--text-dim);grid-column:1/-1;padding:20px 0;">Platform ini tidak punya katalog series. Coba tab Film.</div>`;
            const c = document.getElementById('providerCount');
            if (c) c.textContent = 'Hanya katalog film';
            return;
        }

        // Region ID for providers with local coverage, otherwise US (much bigger catalog)
        const region = REGION_ID_OK.has(id) ? 'ID' : 'US';
        // Reuse the same sort semantics as the "Terbaru" browse page, then pin
        // the watch provider + region on top so the filter applies per platform.
        const buildQuery = (reg) => ({
            ...buildDiscoverParams(kind, sortKey, providerState.page),
            watch_region: reg,
            with_watch_providers: id,
        });
        let data = await tmdb(`/discover/${kind}`, buildQuery(region));

        // Fallback to US if the ID region returns nothing
        if ((!data.results || data.results.length === 0) && region === 'ID') {
            data = await tmdb(`/discover/${kind}`, buildQuery('US'));
        }

        const items = (data.results || []).map(r => { r.media_type = kind; return r; });
        providerState.results = providerState.results.concat(items);
        providerState.total = data.total_results || 0;

        document.getElementById('providerLoading')?.remove();
        renderCards('providerGrid', providerState.results);

        const countEl = document.getElementById('providerCount');
        if (countEl) {
            countEl.textContent = providerState.total
                ? `${providerState.total.toLocaleString('id-ID')} judul • ${kind === 'tv' ? 'Series' : 'Film'}`
                : 'Katalog tidak tersedia';
        }

        const wrap = document.getElementById('loadMoreWrap');
        if (wrap) {
            const hasMore = providerState.page < (data.total_pages || 1);
            wrap.innerHTML = hasMore
                ? `<button class="hero-btn" style="background:var(--surface);font-size:0.9rem;"
                     onclick="navigate('provider',{id:${id},tab:'${kind}',sort:'${sortKey}',page:${providerState.page + 1}})">
                     Muat Lebih Banyak
                   </button>`
                : (providerState.results.length ? `<div style="color:var(--text-dim);font-size:0.82rem;">Semua judul sudah dimuat</div>` : '');
        }

        if (providerState.results.length === 0) {
            document.getElementById('providerGrid').innerHTML =
                `<div style="color:var(--text-dim);grid-column:1/-1;padding:20px 0;">
                   Tidak ada ${kind === 'tv' ? 'series' : 'film'} untuk platform ini. Coba tab lainnya.
                 </div>`;
        }
    } catch(e) {
        document.getElementById('providerLoading')?.remove();
        const wrap = document.getElementById('loadMoreWrap');
        if (wrap) wrap.innerHTML = `<div style="color:var(--text-dim)">❌ ${e.message}</div>`;
    }
}

// ===== Terbaru / Browse with sorting =====
const SORT_OPTIONS = [
    { key: 'baru',    label: '🆕 Rilis Terbaru' },
    { key: 'trending',label: '🔥 Baru & Trending (90 hari)' },
    { key: 'populer', label: '⭐ Paling Populer' },
    { key: 'rating',  label: '🏆 Rating Tertinggi' },
    { key: 'lama',    label: '📼 Rilis Terlama' },
];

let latestState = { kind: 'movie', sort: 'baru', page: 1, results: [], total: 0, pages: 1 };

function todayISO() { return new Date().toISOString().slice(0, 10); }
function daysAgoISO(n) {
    const d = new Date(Date.now() - n * 86400000);
    return d.toISOString().slice(0, 10);
}

function buildDiscoverParams(kind, sort, page) {
    const dateField = kind === 'movie' ? 'primary_release_date' : 'first_air_date';
    const p = { page, include_adult: false };
    switch (sort) {
        case 'baru':
            p.sort_by = `${dateField}.desc`;
            p[`${dateField}.lte`] = todayISO();
            p['vote_count.gte'] = 1;
            break;
        case 'trending':
            p.sort_by = 'popularity.desc';
            p[`${dateField}.gte`] = daysAgoISO(90);
            p[`${dateField}.lte`] = todayISO();
            break;
        case 'populer':
            p.sort_by = 'popularity.desc';
            break;
        case 'rating':
            p.sort_by = 'vote_average.desc';
            p['vote_count.gte'] = kind === 'movie' ? 500 : 150;
            break;
        case 'lama':
            p.sort_by = `${dateField}.asc`;
            p[`${dateField}.gte`] = '1900-01-01';
            p['vote_count.gte'] = 10;
            break;
    }
    return p;
}

async function renderLatest(opts) {
    const { kind = latestState.kind, sort = latestState.sort, page = 1 } = opts || {};
    const app = document.getElementById('app');
    const fresh = page === 1;

    if (fresh) latestState = { kind, sort, page, results: [], total: 0, pages: 1 };
    else latestState.page = page;

    const kindLabel = kind === 'movie' ? 'Film' : 'Series';

    if (fresh) {
        app.innerHTML = `
            <div class="provider-header">
                <div>
                    <h1>🆕 ${kindLabel} Terbaru</h1>
                    <div class="sub" id="latestCount">Memuat…</div>
                </div>
            </div>
            <div class="provider-tabs">
                <button class="provider-tab ${kind === 'movie' ? 'active' : ''}"
                        onclick="navigate('latest',{kind:'movie',sort:'${sort}'})">🎬 Film</button>
                <button class="provider-tab ${kind === 'tv' ? 'active' : ''}"
                        onclick="navigate('latest',{kind:'tv',sort:'${sort}'})">📺 Series</button>
                <select class="sort-select" onchange="navigate('latest',{kind:'${kind}',sort:this.value})">
                    ${SORT_OPTIONS.map(o => `<option value="${o.key}" ${o.key === sort ? 'selected' : ''}>${o.label}</option>`).join('')}
                </select>
            </div>
            <div class="section">
                <div class="card-grid" id="latestGrid"></div>
                <div id="latestLoading" class="loading"><div class="loading-spinner"></div>Memuat ${kindLabel.toLowerCase()}…</div>
            </div>
            <div class="load-more-wrap" id="latestMore"></div>
        `;
    } else {
        const more = document.getElementById('latestMore');
        if (more) more.innerHTML = `<div class="loading"><div class="loading-spinner"></div></div>`;
    }

    try {
        const data = await tmdb(`/discover/${kind}`, buildDiscoverParams(kind, sort, page));
        const items = (data.results || [])
            .filter(r => r.poster_path)
            .map(r => { r.media_type = kind; return r; });

        latestState.results = latestState.results.concat(items);
        latestState.total = data.total_results || 0;
        latestState.pages = data.total_pages || 1;

        document.getElementById('latestLoading')?.remove();
        renderCards('latestGrid', latestState.results);

        const c = document.getElementById('latestCount');
        if (c) {
            const sortLabel = (SORT_OPTIONS.find(o => o.key === sort) || {}).label || '';
            c.textContent = `${latestState.total.toLocaleString('id-ID')} judul • ${sortLabel} • diperbarui ${todayISO()}`;
        }

        const more = document.getElementById('latestMore');
        if (more) {
            more.innerHTML = page < latestState.pages
                ? `<button class="hero-btn" style="background:var(--surface);font-size:0.9rem;"
                     onclick="navigate('latest',{kind:'${kind}',sort:'${sort}',page:${page + 1}})">Muat Lebih Banyak</button>`
                : `<div style="color:var(--text-dim);font-size:0.82rem;">Semua judul sudah dimuat</div>`;
        }
    } catch (e) {
        document.getElementById('latestLoading')?.remove();
        const more = document.getElementById('latestMore');
        if (more) more.innerHTML = `<div style="color:var(--text-dim)">❌ ${e.message}</div>`;
    }
}

// ===== DRACIN (drama pendek vertikal) =====
// Source table is fetched from /api/dracin?action=sources so the server stays
// the single place that knows which hosts are verified. This literal is only a
// first-paint fallback for when that call is still in flight.
let DRACIN_SOURCES = [
    { key: 'fresh', label: '🔥 Terbaru', note: 'Rilis terbaru dari semua sumber', shape: 'mixed' },
    { key: 'dytt', label: 'Utama', short: 'UT', note: 'Episode terpisah · katalog terbesar', shape: 'episodes' },
    { key: 'ffzy', label: 'Katalog Besar', short: 'KB', note: 'Episode terpisah', shape: 'episodes' },
    { key: 'ikun', label: 'Vertikal HD', short: 'HD', note: 'Portrait asli · episode terpisah', shape: 'episodes' },
    { key: 'uku', label: 'Update Harian', short: 'UH', note: 'Rilis terbaru · 1 file penuh', shape: 'full' },
    { key: 'subo', label: 'Arsip Besar', short: 'AB', note: '35rb+ judul · 1 file penuh', shape: 'full' },
];

let _dracinSourcesLoaded = false;
// Sources served by /api/dracin-id (Indonesian-localized) rather than the
// MacCMS /api/dracin endpoint. Their episodes resolve their media URL lazily.
const DRACIN_ID_SOURCES = new Set(['reelshort']);
async function loadDracinSources() {
    if (_dracinSourcesLoaded) return;
    let macc = [];
    let idsrc = [];
    try {
        const r = await fetch('/api/dracin?action=sources');
        const d = await r.json();
        if (d.success && Array.isArray(d.sources)) macc = d.sources;
    } catch { /* keep fallback */ }
    try {
        const r2 = await fetch('/api/dracin-id?action=sources');
        const d2 = await r2.json();
        if (d2.success && Array.isArray(d2.sources)) idsrc = d2.sources;
    } catch { /* localized sources optional */ }
    if (macc.length || idsrc.length) {
        DRACIN_SOURCES = [
            { key: 'fresh', label: '🔥 Terbaru', note: 'Rilis terbaru dari semua sumber', shape: 'mixed' },
            // Indonesian-localized sources first — this is what the user asked for.
            ...idsrc,
            ...macc,
        ];
    }
    _dracinSourcesLoaded = true;
}

let dracinState = { source: 'fresh', page: 1, items: [], pages: 1, total: 0, q: '' };
let dracinDetail = null;

function dracinImg(url) {
    return url ? '/api/dracin-img?u=' + encodeURIComponent(url) : '';
}

async function dracinApi(params) {
    // Indonesian-localized sources live behind /api/dracin-id; everything else
    // (the MacCMS catalogs + the mixed "fresh" feed) behind /api/dracin.
    const base = DRACIN_ID_SOURCES.has(params.source) ? '/api/dracin-id' : '/api/dracin';
    const r = await fetch(base + '?' + new URLSearchParams(params));
    const d = await r.json();
    if (!r.ok || !d.success) throw new Error(d.detail || d.error || 'gagal memuat');
    return d;
}

async function renderDracin(opts) {
    await loadDracinSources();
    const { source = dracinState.source, page = 1, q = '' } = opts || {};
    const app = document.getElementById('app');
    const fresh = page === 1;
    const isFreshFeed = source === 'fresh';
    const meta = DRACIN_SOURCES.find(s => s.key === source) || {};

    if (fresh) dracinState = { source, page, items: [], pages: 1, total: 0, q };
    else dracinState.page = page;

    if (fresh) {
        app.innerHTML = `
            <div class="dracin-hero">
                <div class="dracin-hero-inner">

                </div>
            </div>
            <div class="provider-tabs">
                ${DRACIN_SOURCES.map(s => `

                `).join('')}
                <div class="dracin-search">
                    <input type="text" id="dracinSearch" placeholder="Cari judul dracin…"
                           value="${q.replace(/"/g, '&quot;')}"

            data = await dracinApi({ action: 'search', source: searchSrc, q });
        } else if (isFreshFeed) {
            data = await dracinApi({ action: 'fresh', per: 14 });
        } else {
            data = await dracinApi({ action: 'list', source, page });
        }

        dracinState.items = dracinState.items.concat(data.items || []);
        dracinState.pages = data.pages || 1;
        dracinState.total = data.total || dracinState.items.length;

        document.getElementById('dracinLoading')?.remove();
        renderDracinCards('dracinGrid', dracinState.items);

        const c = document.getElementById('dracinCount');
        if (c) {
            if (q) {
                c.textContent = `${dracinState.items.length} hasil untuk "${q}"`;
            } else if (isFreshFeed) {
                const failed = (data.failedSources || []).length;
                c.textContent = `${dracinState.items.length} judul terbaru dari ${DRACIN_SOURCES.length - 1 - failed} sumber`
                    + (failed ? ` · ${failed} sumber sedang tidak aktif` : '');
            } else {
                c.textContent = `${dracinState.total.toLocaleString('id-ID')} judul tersedia`
                    + (meta.note ? ` · ${meta.note}` : '');
            }
        }

        const more = document.getElementById('dracinMore');
        if (more) {
            more.innerHTML = (!q && !isFreshFeed && page < dracinState.pages)
                ? `<button class="hero-btn" style="background:var(--surface);font-size:0.9rem;"
                     onclick="navigate('dracin',{source:'${source}',page:${page + 1}})">Muat Lebih Banyak</button>`
                : (dracinState.items.length && !isFreshFeed ? `<div style="color:var(--text-dim);font-size:0.82rem;">Semua judul sudah dimuat</div>` : '');
        }

        if (dracinState.items.length === 0) {
            document.getElementById('dracinGrid').innerHTML =
                `<div style="color:var(--text-dim);grid-column:1/-1;padding:24px 0;">Tidak ada hasil. Coba sumber lain.</div>`;
        }
    } catch (e) {
        document.getElementById('dracinLoading')?.remove();
        const more = document.getElementById('dracinMore');
        if (more) more.innerHTML = `<div style="color:var(--text-dim)">❌ ${e.message} — coba sumber lain.</div>`;
    }
}

function dracinDoSearch() {
    const v = document.getElementById('dracinSearch')?.value.trim();
    if (!v) return;
    navigate('dracin', { source: dracinState.source, q: v });
}

function renderDracinCards(elId, items) {
    const el = document.getElementById(elId);
    if (!el) return;
    const showSrc = items.length && new Set(items.map(i => i.src)).size > 1;
    const srcMeta = k => DRACIN_SOURCES.find(s => s.key === k) || {};
    el.innerHTML = items.map(it => {
        const sm = srcMeta(it.src);
        // Two badges carrying the same word ("Full" top-left and "Full"
        // bottom-left) reads as duplicated data, so the count slot is only
        // rendered when it actually carries a number.
        const epsBadge = it.episodes > 1 ? `<div class="dracin-eps">${it.episodes} eps</div>` : '';
        return `
        <div class="dracin-card" onclick="navigate('dracinDetail',{src:'${it.src}',id:'${String(it.id).replace(/'/g, '')}'})">
            <div class="dracin-poster">
                ${it.pic
                    ? `<img src="${dracinImg(it.pic)}" alt="${escapeAttr(it.title)}" loading="lazy"
                           onerror="this.parentElement.classList.add('noimg')">`
                    : ''}
                ${epsBadge}
                ${it.remarks ? `<div class="dracin-badge">${escapeHtml(it.remarks)}</div>` : ''}
                ${showSrc ? `<div class="dracin-srcbadge" title="${escapeAttr(sm.label || it.src)}">${escapeHtml(sm.short || (sm.label || it.src).slice(0, 2).toUpperCase())}</div>` : ''}
                <div class="dracin-play">▶</div>
            </div>
            <div class="dracin-body">
                <div class="dracin-title" title="${escapeAttr(it.title)}${it.titleOrig && it.titleOrig !== it.title ? ' — ' + escapeAttr(it.titleOrig) : ''}">${escapeHtml(it.title)}</div>
                <div class="dracin-meta">${[it.year, it.area].filter(Boolean).join(' • ')}</div>
            </div>
        </div>`;
    }).join('');
}

function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, ''); }

let _dracinHls = null;

async function renderDracinPlayer({ src, id, ep }) {
    const app = document.getElementById('app');
    const epNum = Math.max(1, parseInt(ep, 10) || 1);

    // Reuse the cached detail when it matches, otherwise refetch.
    let it = dracinDetail;
    if (!it || it.id !== id || it.src !== src) {
        app.innerHTML = `<div class="loading"><div class="loading-spinner"></div>Memuat…</div>`;
        try {
            const d = await dracinApi({ action: 'detail', source: src, id });
            it = d.item;
            dracinDetail = it;
        } catch (e) {
            app.innerHTML = `<div class="loading">❌ ${e.message}</div>`;
            return;
        }
    }

    const total = it.epList.length;
    const idx = Math.min(epNum, total) - 1;
    const cur = it.epList[idx];
    if (!cur) {
        app.innerHTML = `<div class="loading">❌ Episode tidak tersedia.</div>`;
        return;
    }

    // ID-safe: book ids from the localized sources are hex strings, so every
    // navigate() call embeds the id as a quoted string literal.
    const idLit = `'${String(id).replace(/'/g, '')}'`;

    app.innerHTML = `
        <div class="dracin-player-wrap">
            <div class="dracin-player-top">
                <div class="player-back" onclick="navigate('dracinDetail',{src:'${src}',id:${idLit}})">← Kembali</div>
                <div class="dracin-player-title">${escapeHtml(it.title)} — ${escapeHtml(cur.label)}</div>
            </div>
            <div class="dracin-stage">
                <video id="dracinVideo" controls autoplay playsinline
                       style="width:100%;height:100%;object-fit:contain;background:#000;"></video>
                <div id="dracinErr" class="dracin-err" style="display:none;">
                    <div class="dracin-err-msg">⚠️ Episode ini gagal diputar.</div>
                    <button class="hero-btn" style="font-size:0.82rem;padding:8px 16px;margin-top:10px;"
                            onclick="navigate('dracinPlayer',{src:'${src}',id:${idLit},ep:${epNum}})">Coba Lagi</button>
                </div>
            </div>
            <div class="dracin-player-ctrl">
                <button class="provider-tab" ${idx === 0 ? 'disabled' : ''}
                        onclick="navigate('dracinPlayer',{src:'${src}',id:${idLit},ep:${epNum - 1}})">⏮ Sebelumnya</button>
                <select class="sort-select" style="margin:0;" onchange="navigate('dracinPlayer',{src:'${src}',id:${idLit},ep:parseInt(this.value)})">
                    ${it.epList.map((e2, i) => `<option value="${i + 1}" ${i === idx ? 'selected' : ''}>${escapeHtml(e2.label || ('Eps ' + (i + 1)))}</option>`).join('')}
                </select>
                <select id="dracinQuality" class="sort-select" style="margin:0;display:none;"
                        onchange="dracinSetQuality(this.value)"></select>
                <button class="provider-tab" ${idx >= total - 1 ? 'disabled' : ''}
                        onclick="navigate('dracinPlayer',{src:'${src}',id:${idLit},ep:${epNum + 1}})">Selanjutnya ⏭</button>
            </div>
            <div class="section" style="padding-top:4px;">
                <div class="section-title" style="font-size:1rem;">Episode Lain</div>
                <div class="dracin-ep-grid">
                    ${it.epList.map((e2, i) => `
                        <div class="dracin-ep ${i === idx ? 'active' : ''}"
                             onclick="navigate('dracinPlayer',{src:'${src}',id:${idLit},ep:${i + 1}})">
                            ${escapeHtml(e2.label || ('Eps ' + (i + 1)))}
                        </div>
                    `).join('')}
                </div>
            </div>
        </div>
    `;

    const video = document.getElementById('dracinVideo');
    const errBox = document.getElementById('dracinErr');
    const stage = document.querySelector('.dracin-stage');

    function showError(msg) {
        if (!errBox) return;
        errBox.querySelector('.dracin-err-msg').textContent = msg;
        errBox.style.display = 'flex';
    }
    function hideError() {
        if (errBox) errBox.style.display = 'none';
    }

    // Localized sources (ReelShort etc.) do not ship a media URL in the episode
    // list — the upstream rate-limits, so each episode's m3u8 is resolved only
    // when it's actually opened. Resolve it now, before wiring up hls.js.
    let streamUrl = cur.url;
    if (!streamUrl && DRACIN_ID_SOURCES.has(src)) {
        try {
            const r = await dracinApi({ action: 'episode', source: src, id, ep: cur.ep || (idx + 1) });
            if (r.locked) { showError('Episode ini terkunci di sumbernya.'); return; }
            streamUrl = r.url;
        } catch (e) {
            showError(e.message === 'rate_limited'
                ? 'Sumber sedang membatasi permintaan. Tunggu sebentar lalu coba lagi.'
                : 'Gagal mengambil tautan episode dari sumbernya.');
            return;
        }
    }
    if (!streamUrl) { showError('Episode ini tidak punya tautan yang bisa diputar.'); return; }

    // The catalogs are NOT uniformly portrait. Measured per host:
    //   ikun / uku / subo  -> 720x1280, 1080x1920, 1280x2274  (portrait)
    //   ffzy / dytt        -> 1256x720 on many titles          (landscape)
    // A fixed 9/16 stage pillarboxes the landscape ones badly, so the stage
    // aspect is set from the real decoded dimensions once they are known.
    function fitStage() {
        if (!stage || !video.videoWidth || !video.videoHeight) return;
        const ratio = video.videoWidth / video.videoHeight;
        if (ratio > 1.05) {
            // Landscape source: give it a wide stage instead of black bars.
            stage.style.aspectRatio = '16 / 9';
            stage.style.maxWidth = '900px';
        } else {
            stage.style.aspectRatio = '9 / 16';
            stage.style.maxWidth = '430px';
        }
    }
    video.addEventListener('loadedmetadata', fitStage);
    video.addEventListener('resize', fitStage);

    // Merged full-series playlists are 500–5,700 segments; the slowest variant
    // playlist measured took 71 s to load. Without a timeout that reads to the
    // user as "won't play" with no feedback, so fail loudly at 25 s instead.
    let manifestOk = false;
    const manifestTimer = setTimeout(() => {
        if (!manifestOk) {
            showError('Sumber ini lambat merespons. Coba episode lain atau sumber lain.');
        }
    }, 25000);

    // Media CDNs for these sources send Access-Control-Allow-Origin: *,
    // so hls.js can load the playlist directly with no relay.
    if (window.Hls && Hls.isSupported()) {
        if (_dracinHls) { try { _dracinHls.destroy(); } catch (e) {} }
        let netRetries = 0;
        _dracinHls = new Hls({
            enableWorker: true,
            maxBufferLength: 20,
            backBufferLength: 20,
            abrEwmaDefaultEstimate: 1200000,
            startFragPrefetch: true,
            startLevel: -1,
            manifestLoadingTimeOut: 20000,
            manifestLoadingMaxRetry: 2,
            levelLoadingTimeOut: 20000,
            fragLoadingTimeOut: 30000,
        });
        _dracinHls.loadSource(streamUrl);
        _dracinHls.attachMedia(video);
        _dracinHls.on(Hls.Events.MANIFEST_PARSED, (e, data) => {
            manifestOk = true;
            clearTimeout(manifestTimer);
            hideError();
            const q = document.getElementById('dracinQuality');
            if (q && data.levels.length > 1) {
                q.innerHTML = '<option value="-1">Auto</option>' +
                    data.levels.map((l, i) => `<option value="${i}">${l.height || '?'}p</option>`).join('');
                q.style.display = 'inline-block';
            }
            video.play().catch(() => {});
        });
        _dracinHls.on(Hls.Events.ERROR, (e, data) => {
            if (!data.fatal) return;
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                // Bounded retry: an unbounded startLoad() loop hides a dead
                // host behind a spinner forever.
                if (++netRetries <= 3) {
                    setTimeout(() => { try { _dracinHls.startLoad(); } catch (x) {} }, 1000 * netRetries);
                } else {
                    clearTimeout(manifestTimer);
                    showError('Episode ini tidak dapat dimuat dari sumbernya.');
                }
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                try { _dracinHls.recoverMediaError(); } catch (x) {
                    showError('Gagal memutar stream ini.');
                }
            } else {
                clearTimeout(manifestTimer);
                showError('Episode ini gagal diputar.');
            }
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari / iOS: native HLS.
        video.src = streamUrl;
        video.addEventListener('loadedmetadata', () => {
            manifestOk = true;
            clearTimeout(manifestTimer);
            hideError();
        });
        video.addEventListener('error', () => {
            clearTimeout(manifestTimer);
            showError('Episode ini gagal diputar.');
        });
        video.play().catch(() => {});
    } else {
        clearTimeout(manifestTimer);
        showError('Browser ini tidak mendukung HLS.');
    }

    // Auto-advance to the next episode, the way short-drama apps behave.
    video.addEventListener('ended', () => {
        if (idx < total - 1) navigate('dracinPlayer', { src, id, ep: epNum + 1 });
    });
}

function dracinSetQuality(level) {
    if (_dracinHls) _dracinHls.currentLevel = parseInt(level, 10);
}

                    ${q ? `<button class="provider-tab" onclick="navigate('nxr',{type:'${type}'})">✕ Reset</button>` : ''}
                </div>
            </div>
            <div class="section">
                <div class="sub" id="nxrCount" style="color:var(--text-dim);font-size:0.85rem;margin-bottom:12px;">Memuat…</div>
                <div class="card-grid" id="nxrGrid"></div>
                <div id="nxrLoading" class="loading"><div class="loading-spinner"></div>Memuat katalog…</div>
            </div>
            <div class="load-more-wrap" id="nxrMore"></div>
        `;
    } else {
        document.getElementById('nxrMore').innerHTML = `<div class="loading"><div class="loading-spinner"></div></div>`;
    }

    try {
        let data;
        if (q) {
            data = await nxrApi({ action: 'search', q });
            nxrState.items = data.items || [];
        } else {
            data = await nxrApi({ action: 'list', type, page });
            nxrState.items = nxrState.items.concat(data.items || []);
        }

        document.getElementById('nxrLoading')?.remove();
        renderNxrCards('nxrGrid', nxrState.items);

        const c = document.getElementById('nxrCount');
        if (c) {
            c.textContent = q
                ? `${nxrState.items.length} hasil untuk "${q}"`
                : `${nxrState.items.length} judul tersedia`;
        }

        const more = document.getElementById('nxrMore');
        if (more) {
            more.innerHTML = (!q && nxrState.items.length > 0)
                ? `<button class="hero-btn" style="background:var(--surface);font-size:0.9rem;"
                     onclick="navigate('nxr',{type:'${type}',page:${page + 1}})">Muat Lebih Banyak</button>`
                : (nxrState.items.length ? `<div style="color:var(--text-dim);font-size:0.82rem;">Semua judul sudah dimuat</div>` : '');
        }

        if (nxrState.items.length === 0) {
            document.getElementById('nxrGrid').innerHTML =
                `<div style="color:var(--text-dim);grid-column:1/-1;padding:24px 0;">Tidak ada hasil.</div>`;
        }
    } catch (e) {
        document.getElementById('nxrLoading')?.remove();
        document.getElementById('nxrMore').innerHTML = `<div style="color:var(--text-dim)">❌ ${e.message}</div>`;
    }
}

function nxrDoSearch() {
    const v = document.getElementById('nxrSearch')?.value.trim();
    if (!v) return;
    navigate('nxr', { q: v });
}

function renderNxrCards(elId, items) {
    const el = document.getElementById(elId);
    if (!el) return;
    el.innerHTML = items.map(it => {
        const title = escapeHtml(it.title || it.enName || it.name || 'Unknown');
        const poster = it.coverVerticalUrl ? nxrImg(it.coverVerticalUrl) : '';
        const year = it.year || '';
        const score = it.score ? `★ ${Number(it.score).toFixed(1)}` : '';
        const typeLabel = it.category === 0 ? 'Film' : (it.category === 1 ? 'Series' : '');
        return `
            <div class="card" onclick="navigate('nxrDetail',{id:'${it.id}',category:${it.category ?? 0}})">
                ${score ? `<div class="rating-badge">${score}</div>` : ''}
                ${poster
                    ? `<img src="${poster}" alt="${escapeAttr(title)}" loading="lazy"
                           onerror="this.style.display='none'">`
                    : `<div class="placeholder-poster" style="aspect-ratio:2/3">${title}</div>`}
                <div class="card-body">
                    <div class="title">${title}</div>
                    <div class="meta">${year}${typeLabel ? ' • ' + typeLabel : ''}</div>
                </div>
            </div>
        `;
    }).join('');
}

async function renderNxrPlayer({ id, category, ep }) {
    const app = document.getElementById('app');
    const epIdx = Math.max(0, parseInt(ep, 10) || 0);

    let it = nxrDetail;
    if (!it || String(it.id) !== String(id) || it.category !== category) {
        app.innerHTML = `<div class="loading"><div class="loading-spinner"></div>Memuat…</div>`;
        try {
            const d = await nxrApi({ action: 'detail', id, category });
            it = d.item;
            it.id = id;
            it.category = category;
            nxrDetail = it;
        } catch (e) {
            app.innerHTML = `<div class="loading">❌ ${e.message}</div>`;
            return;
        }
    }

    const episodes = it.episodes || [];
    if (episodes.length === 0) {
        app.innerHTML = `<div class="loading">❌ Tidak ada episode yang tersedia untuk judul ini.</div>`;
        return;
    }

    const cur = episodes[Math.min(epIdx, episodes.length - 1)];
    if (!cur) {
        app.innerHTML = `<div class="loading">❌ Episode tidak tersedia.</div>`;
        return;
    }

    app.innerHTML = `
        <div class="player-wrap">
            <div class="player-container">
                <div class="player-back" onclick="navigate('nxrDetail',{id:'${id}',category:${category}})">← Kembali</div>
                <div class="player-title">${escapeHtml(it.title || it.enName || it.name)} — ${escapeHtml(cur.label)}</div>
                <div id="nxr-loading" class="loading"><div class="loading-spinner"></div>Mengambil stream…</div>
                <div id="nxr-area" style="display:none;">
                    <div class="player-frame-wrap" style="background:#000;">
                        <video id="nxrVideo" controls autoplay playsinline
                               style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;background:#000;"></video>
                    </div>
                </div>
                <div id="nxr-error" style="display:none;padding:20px;text-align:center;">
                    <p style="color:var(--text-dim);margin-bottom:12px;">⚠️ Stream tidak tersedia untuk episode ini.</p>
                    <button class="hero-btn" style="font-size:0.85rem;padding:10px 20px;" onclick="navigate('nxrPlayer',{id:'${id}',category:${category},ep:${epIdx}})">Coba Lagi</button>
                </div>
                <div id="nxr-controls" style="display:none;margin-top:16px;gap:8px;flex-wrap:wrap;align-items:center;">
                    ${episodes.length > 1 ? `
                        <button class="hero-btn" style="background:var(--surface);font-size:0.85rem;padding:10px 20px;"
                                ${epIdx === 0 ? 'disabled' : ''}
                                onclick="navigate('nxrPlayer',{id:'${id}',category:${category},ep:${epIdx - 1}})">⏮ Sebelumnya</button>
                        <select class="sort-select" style="margin:0;" onchange="navigate('nxrPlayer',{id:'${id}',category:${category},ep:parseInt(this.value)})">
                            ${episodes.map((e2, i) => `<option value="${i}" ${i === epIdx ? 'selected' : ''}>${escapeHtml(e2.label || ('Eps ' + (i + 1)))}</option>`).join('')}
                        </select>
                        <button class="hero-btn" style="background:var(--surface);font-size:0.85rem;padding:10px 20px;"
                                ${epIdx >= episodes.length - 1 ? 'disabled' : ''}
                                onclick="navigate('nxrPlayer',{id:'${id}',category:${category},ep:${epIdx + 1}})">Selanjutnya ⏭</button>
                    ` : ''}
                    <select id="nxrSubSelect" onchange="nxrSetSub(this.value)" style="background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 14px;font-size:0.85rem;cursor:pointer;display:none;max-width:220px;"></select>
                    <select id="nxrQuality" onchange="nxrSetQuality(this.value)" style="background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 14px;font-size:0.85rem;cursor:pointer;display:none;"></select>
                </div>
            </div>
        </div>
    `;

    // Fetch stream URL
    const defs = cur.definitionList || [];
    const defCode = defs.length > 0 ? defs[0].code : 'GROOT_LD';

    try {
        const params = new URLSearchParams({
            action: 'media',
            contentId: String(id),
            category: String(category),
            episodeId: String(cur.id),
            definition: defCode,
        });
        const resp = await fetch('/api/nxrstream?' + params);
        const sdata = await resp.json();

        if (!sdata.success || !sdata.streamUrl) {
            // Stream unavailable — try embedded subtitles from detail as fallback
            document.getElementById('nxr-loading').style.display = 'none';
            document.getElementById('nxr-error').style.display = 'block';
            // But still show subtitles if available from detail
            if (cur.subtitlingList && cur.subtitlingList.length > 0) {
                document.getElementById('nxr-error').innerHTML += '<p style="color:var(--text-dim);margin-top:8px;font-size:0.82rem;">Subtitles tersedia tapi stream sedang diproses.</p>';
            }
            return;
        }

        const video = document.getElementById('nxrVideo');
        const streamUrl = sdata.streamUrl;
        _nxrCurrentSubs = [...(sdata.subtitles || []), ...(cur.subtitlingList || [])];

        // Setup HLS
        if (window.Hls && Hls.isSupported()) {
            if (_nxrHls) { try { _nxrHls.destroy(); } catch(e){} }
            _nxrHls = new Hls({
                enableWorker: true,
                backBufferLength: 30,
                maxBufferLength: 30,
                startLevel: -1,
                abrEwmaDefaultEstimate: 1000000,
                startFragPrefetch: true,
            });
            _nxrHls.loadSource(streamUrl);
            _nxrHls.attachMedia(video);
            _nxrHls.on(Hls.Events.MANIFEST_PARSED, () => {
                document.getElementById('nxr-loading').style.display = 'none';
                document.getElementById('nxr-area').style.display = 'block';
                document.getElementById('nxr-controls').style.display = 'flex';

                // Quality selector
                const qSel = document.getElementById('nxrQuality');
                if (qSel && _nxrHls.levels.length > 1) {
                    qSel.innerHTML = '<option value="-1">Auto</option>' +
                        _nxrHls.levels.map((l, i) => `<option value="${i}">${l.height || '?'}p</option>`).join('');
                    qSel.style.display = 'inline-block';
                }

                video.play().catch(() => {});
                nxrSetupSubs();
            });
            _nxrHls.on(Hls.Events.ERROR, (e, data) => {
                if (!data.fatal) return;
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    setTimeout(() => { try { _nxrHls.startLoad(); } catch(x){} }, 1000);
                } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                    _nxrHls.recoverMediaError();
                } else {
                    document.getElementById('nxr-loading').style.display = 'none';
                    document.getElementById('nxr-error').style.display = 'block';
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.play().catch(() => {});
            document.getElementById('nxr-loading').style.display = 'none';
            document.getElementById('nxr-area').style.display = 'block';
            document.getElementById('nxr-controls').style.display = 'flex';
            nxrSetupSubs();
        } else {
            document.getElementById('nxr-loading').style.display = 'none';
            document.getElementById('nxr-error').style.display = 'block';
        }

        // Auto-advance
        video.addEventListener('ended', () => {
            if (epIdx < episodes.length - 1) {
                navigate('nxrPlayer', { id, category, ep: epIdx + 1 });
            }
        });
    } catch (err) {
        document.getElementById('nxr-loading').style.display = 'none';
        document.getElementById('nxr-error').style.display = 'block';
    }
}

function nxrSetupSubs() {
    const subSel = document.getElementById('nxrSubSelect');
    if (!subSel || _nxrCurrentSubs.length === 0) return;

    const langNames = {
        en: 'English', eng: 'English', id: 'Indonesia', ind: 'Indonesia', 'in_ID': 'Bahasa Indonesia',
        in: 'Indonesia', may: 'Melayu', msa: 'Melayu', vi: 'Tiếng Việt', vie: 'Tiếng Việt',
        th: 'ไทย', tha: 'ไทย', ja: '日本語', jpn: '日本語', ko: '한국어', kor: '한국어',
        zh: '中文', chi: '中文', zho: '中文', ar: 'العربية', ara: 'العربية',
        fr: 'Français', fre: 'Français', es: 'Español', spa: 'Español',
        de: 'Deutsch', ger: 'Deutsch', pt: 'Português', por: 'Português',
        ru: 'Русский', rus: 'Русický', hi: 'हिन्दी', hin: 'हिन्दी',
        tr: 'Türkçe', tur: 'Türkçe', it: 'Italiano', ita: 'Italiano',
    };

    _nxrSubs = _nxrCurrentSubs.map((s, i) => ({
        ...s,
        idx: i,
        label: (langNames[s.lang] || s.language || s.lang || 'Sub ' + (i + 1)) + (s.translateType ? ' (Auto)' : ''),
        proxied: '/api/sub?url=' + encodeURIComponent(s.url),
    }));

    subSel.innerHTML = '<option value="">CC Off</option>' +
        _nxrSubs.map(s => `<option value="${s.idx}">${s.label}</option>`).join('');
    subSel.style.display = 'inline-block';

    // Auto-pick Indonesian, then English
    const pick = _nxrSubs.find(s => s.lang === 'in_ID' || s.lang === 'id' || s.lang === 'ind')
        || _nxrSubs.find(s => s.lang === 'en' || s.lang === 'eng');
    if (pick) {
        subSel.value = String(pick.idx);
        nxrApplySub(pick.idx);
    }
}

function nxrSetSub(idxStr) {
    const video = document.getElementById('nxrVideo');
    if (!video) return;
    video.querySelectorAll('track').forEach(t => t.remove());
    for (let i = 0; i < video.textTracks.length; i++) video.textTracks[i].mode = 'disabled';
    if (idxStr === '' || idxStr == null) return;
    nxrApplySub(parseInt(idxStr, 10));
}

function nxrApplySub(idx) {
    const video = document.getElementById('nxrVideo');
    const sub = _nxrSubs[idx];
    if (!video || !sub) return;
    video.querySelectorAll('track').forEach(t => t.remove());
    const track = document.createElement('track');
    track.kind = 'subtitles';
    track.label = sub.label;
    track.srclang = (sub.lang || 'en').slice(0, 2);
    track.src = sub.proxied;
    track.default = true;
    video.appendChild(track);
    track.addEventListener('load', () => { track.track.mode = 'showing'; });
    track.addEventListener('error', () => {});
    setTimeout(() => {
        for (let i = 0; i < video.textTracks.length; i++) video.textTracks[i].mode = 'showing';
    }, 300);
}

function nxrSetQuality(level) {
    if (_nxrHls) _nxrHls.currentLevel = parseInt(level, 10);
}
