function renderCards(elId, items) {
    const el = document.getElementById(elId);
    if (!el) return;
    el.innerHTML = items.map(item => {
        const type = item.media_type || (item.title ? 'movie' : 'tv');
        const title = item.title || item.name;
        const poster = item.poster_path ? TMDB_IMG + item.poster_path : '';
        const rating = item.vote_average ? item.vote_average.toFixed(1) : '';
        const date = item.release_date || item.first_air_date || '';
        const year = date ? date.substring(0,4) : '';

        return `
            <div class="card" onclick="navigate('detail', {type:'${type}', id:${item.id}})">

                ${backdrop ? `<div class="detail-bg" style="background-image:url('${backdrop}')"></div>` : ''}

                <div class="detail-content">
                    ${poster ? `<div class="detail-poster"><img src="${poster}" alt="${title}"></div>` : ''}

                        <h1>${title}</h1>
                        ${data.tagline ? `<p class="tagline">"${data.tagline}"</p>` : ''}
                        <div class="meta-row">
                            <span class="rating">★ ${rating}</span>
                            ${year ? `<span>📅 ${year}</span>` : ''}
                            ${runtime ? `<span>⏱ ${runtime} menit</span>` : ''}
                            ${type === 'tv' ? `<span>📺 ${data.number_of_seasons} musim</span>` : ''}

                        <p class="overview">${data.overview || 'Tidak ada sinopsis.'}</p>
                        <button class="play-btn" onclick="startPlayback()">▶ Nonton</button>
                    </div>
                </div>
            </div>
        `;

        // TV: season/episode selector (all TMDB seasons — sources that lack a
        // season fall back to the iframe sources in the player, so seasons are
        // never hidden here).
        if (type === 'tv' && data.seasons && data.seasons.length > 0) {
            const validSeasons = data.seasons.filter(s => s.season_number > 0 || data.seasons.length === 1);
            html += `
                <div class="section" id="tv-seasons">
                    <div class="section-title">Episodes</div>
                    <div class="season-selector">
                        <select id="seasonSelect" onchange="loadSeason(${id}, this.value)">
                            ${validSeasons.map(s => `<option value="${s.season_number}" ${parseInt(season||1)===s.season_number?'selected':''}>Musim ${s.season_number} (${s.episode_count} eps)</option>`).join('')}
                        </select>
                    </div>
                    <div class="episode-grid" id="episodeGrid"></div>
                </div>
            `;
        }

        // Cast
        if (data.credits && data.credits.cast && data.credits.cast.length > 0) {
            const cast = data.credits.cast.slice(0, 12);
            html += `
                <div class="cast-section">
                    <div class="section-title">Pemeran</div>
                    <div class="cast-grid">
                        ${cast.map(c => `
                            <div class="cast-card">
                                ${c.profile_path ? `<img src="${TMDB_IMG_SM + c.profile_path}" alt="${c.name}">` : `<div style="width:100px;height:100px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:2rem;margin-bottom:6px;">👤</div>`}
                                <div class="name">${c.name}</div>
                                <div class="char">${c.character}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Similar / Recommendations
        const recs = (data.recommendations && data.recommendations.results) || (data.similar && data.similar.results) || [];
        if (recs.length > 0) {
            html += `<div class="section"><div class="section-title">📌 Rekomendasi</div><div class="card-grid" id="grid-recs"></div></div>`;
        }

        app.innerHTML = html;

        if (recs.length > 0) {
            const recItems = recs.slice(0, 12).map(r => { r.media_type = type; return r; });
            renderCards('grid-recs', recItems);
        }

        // Load episodes for TV
        if (type === 'tv' && season) {
            loadSeason(id, season);
        }
    } catch(e) {
        app.innerHTML = `<div class="loading">❌ ${e.message}</div>`;
    }
}

async function loadSeason(id, seasonNum) {
    currentState.season = parseInt(seasonNum);
    const grid = document.getElementById('episodeGrid');
    if (!grid) return;
    grid.innerHTML = `<div class="loading"><div class="loading-spinner"></div></div>`;
    try {
        const data = await tmdb(`/tv/${id}/season/${seasonNum}`);
        const episodes = data.episodes || [];
        grid.innerHTML = episodes.map(ep => `
            <div class="episode-card ${currentState.episode === ep.episode_number ? 'active' : ''}" onclick="playEpisode(${id}, ${seasonNum}, ${ep.episode_number})">
                <div class="ep-num">E${ep.episode_number}</div>
                <div class="ep-name">${ep.name || 'Episode ' + ep.episode_number}</div>
                ${ep.overview ? `<div class="ep-overview">${ep.overview}</div>` : ''}
            </div>
        `).join('');
    } catch(e) {
        grid.innerHTML = `<div style="color:var(--text-dim)">Gagal memuat episode</div>`;
    }
}

let _hls = null;
let _streamData = null;
let _subtitleList = [];
let _sources = [];
let _sourceIdx = 0;
let _currentSource = null;
let _retryCount = 0;
let _openSubCache = {};

// Extra embed source (client-side iframe) offered alongside the clean native
// servers. Loads in the user's own browser (residential IP passes its
// protection), so no server-side access is needed. Label is rebranded so the
// upstream host isn't advertised in the UI.
const IFRAME_SOURCES = [
    { key: 'vip', name: 'NXR-VIP SERVER',
      movie: id => `https://nxsha.space/embed/movie/${id}?lang=en&autoplay=true&sub=en`,
      tv: (id, s, e) => `https://nxsha.space/embed/tv/${id}/${s}/${e}?lang=en&autoplay=true&sub=en` },
];

async function loadStream(type, id, season, episode) {
    const loading = document.getElementById('player-loading');
    const area = document.getElementById('player-area');
    const errDiv = document.getElementById('player-error');
    const controls = document.getElementById('player-controls');

    try {
        const params = new URLSearchParams({ type, id });
        if (type === 'tv') {
            params.set('s', season || 1);
            params.set('e', episode || 1);
        }

        const resp = await fetch(`/api/stream?${params}`);
        _streamData = await resp.json();

        if (_streamData.success) {
            // Back-compat: if the endpoint returned a single stream, wrap it.
            _sources = (_streamData.sources && _streamData.sources.length)
                ? _streamData.sources
                : [{ name: 'Server', streamUrl: _streamData.streamUrl, subtitles: _streamData.subtitles || [] }];
        } else {
            // No native source — iframe fallbacks may still save the episode.
            _sources = [];
        }

        // Append client-side iframe sources as extra selectable servers.
        const iframeSrcs = IFRAME_SOURCES
            .filter(s => type === 'movie' ? !!s.movie : !!s.tv)
            .map(s => ({
                name: s.name + ' ⧉',
                iframe: true,
                iframeUrl: type === 'movie' ? s.movie(id) : s.tv(id, season || 1, episode || 1),
                streamUrl: '',
                subtitles: [],
            }));
        _sources = _sources.concat(iframeSrcs);

        if (_sources.length === 0) throw new Error(_streamData.error || 'Unknown error');

        _sourceIdx = 0;
        _currentSource = _sources[0];

        loading.style.display = 'none';
        area.style.display = 'block';
        controls.style.display = 'flex';

        _playSource(0);
    } catch (err) {
        console.error('Stream error:', err);
        loading.style.display = 'none';
        area.style.display = 'none';
        controls.style.display = 'none';
        errDiv.style.display = 'block';
    }
}

function renderServerBar() {
    const bar = document.getElementById('serverBar');
    const btns = document.getElementById('serverBtns');
    if (!bar || !btns) return;
    if (_sources.length <= 1) { bar.style.display = 'none'; return; }
    bar.style.display = 'flex';
    btns.innerHTML = _sources.map((s, i) =>
        `<button class="server-btn ${i === _sourceIdx ? 'active' : ''}" onclick="_playSource(${i})">` +
        `${escapeHtml(s.name || ('Server ' + (i + 1)))}</button>`
    ).join('');
}

function showPlayerError() {
    const loading = document.getElementById('player-loading');
    const area = document.getElementById('player-area');
    const errDiv = document.getElementById('player-error');
    if (loading) loading.style.display = 'none';
    if (area) area.style.display = 'none';
    if (errDiv) {
        errDiv.style.display = 'block';
        const p = errDiv.querySelector('p');
        if (p) p.textContent = '⚠️ Semua server gagal dimuat untuk judul ini. Coba server/proxy lain.';
    }
}

/** Switch to a specific server and (re)attach HLS (or iframe for embeds). */
function _playSource(idx) {
    const src = _sources[idx];
    if (!src) return;
    _sourceIdx = idx;
    _currentSource = src;
    _retryCount = 0;
    renderServerBar();

    const video = document.getElementById('video');
    const iframe = document.getElementById('playerIframe');
    const qSel = document.getElementById('qualitySelect');
    if (qSel) { qSel.innerHTML = ''; qSel.style.display = 'none'; }

    // ── Iframe source (vidbox-style embed fallback) ──
    if (src.iframe && src.iframeUrl) {
        if (_hls) { _hls.destroy(); _hls = null; }
        if (video) video.style.display = 'none';
        if (iframe) { iframe.src = src.iframeUrl; iframe.style.display = 'block'; }
        const subSel = document.getElementById('subSelect');
        if (subSel) { subSel.innerHTML = '<option value="">CC Off</option>'; subSel.style.display = 'none'; }
        return;
    }

    // ── Native HLS mode ──
    if (iframe) { iframe.src = ''; iframe.style.display = 'none'; }
    if (video) video.style.display = '';
    const streamUrl = src.streamUrl;

    if (_hls) { _hls.destroy(); _hls = null; }

    // Setup HLS.js with ad-stripping + fast start
    if (window.Hls && Hls.isSupported()) {
        _hls = new Hls({
            enableWorker: true,
            lowLatencyMode: false,
            backBufferLength: 30,
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
            startLevel: -1,
            maxBufferSize: 60 * 1000 * 1000,
            maxBufferHole: 0.5,
            abrEwmaDefaultEstimate: 1000000,
            startFragPrefetch: true,
        });
        _hls.loadSource(streamUrl);
        _hls.attachMedia(video);

        // Ad stripping: skip fragments from known ad CDNs
        const adDomains = ['tiktokcdn', 'ad-site-i18n', 'doubleclick', 'googleads', 'googlesyndication', 'popads', 'ad-site-sign'];
        _hls.on(Hls.Events.FRAG_LOADING, (event, data) => {
            const url = data.frag.url || '';
            if (adDomains.some(d => url.includes(d))) {
                console.log('Ad skipped:', url.substring(0, 60));
                data.frag.loader = { destroy: () => {}, load: () => {} };
            }
        });

        _hls.on(Hls.Events.MANIFEST_PARSED, (e, data) => {
            _retryCount = 0;
            const qSel2 = document.getElementById('qualitySelect');
            if (qSel2 && data.levels.length > 1) {
                qSel2.innerHTML = '<option value="-1">Auto</option>' +
                    data.levels.map((l, i) =>
                        `<option value="${i}">${l.height || '?'}p (${Math.round(l.bitrate/1000)}kbps)</option>`
                    ).join('');
                qSel2.style.display = 'inline-block';
            }
            video.play().catch(()=>{});
        });

        _hls.on(Hls.Events.ERROR, (event, data) => {
            if (!data.fatal) return;
            console.error('HLS fatal:', data);
            _retryCount++;
            // Auto-failover: hop to the next server before giving up.
            if (_sourceIdx < _sources.length - 1 && _retryCount > 2) {
                _retryCount = 0;
                _playSource(_sourceIdx + 1);
                return;
            }
            if (_retryCount > 4) { showPlayerError(); return; }
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                setTimeout(() => _hls && _hls.startLoad(), 1000);
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                _hls.recoverMediaError();
            }
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.play().catch(()=>{});
    } else {
        showPlayerError();
    }

    // Refresh subtitle selector for the active server's embedded tracks.
    const { type: t, id: iid, season: ss, episode: ee } = currentState;
    loadSubtitles(t, iid, ss, ee);
}

// ===== Subtitles (multi-language) =====
async function loadSubtitles(type, id, season, episode) {
    const subSel = document.getElementById('subSelect');
    if (!subSel) return;

    // Embedded tracks the active server shipped (switches with the server)
    const embedded = ((_currentSource && (_currentSource.subtitles || []).length)
        ? _currentSource.subtitles
        : (_streamData?.subtitles || [])).map(s => ({ ...s, src: 'stream' }));

    subSel.innerHTML = '<option value="">Memuat subtitle...</option>';
    subSel.style.display = 'inline-block';
    subSel.disabled = true;

    // OpenSubtitles don't depend on the chosen server — cache per title so
    // switching servers doesn't re-fetch them every time.
    const osKey = `${type}|${id}|${season || 1}|${episode || 1}`;
    let online = _openSubCache[osKey] || [];
    if (!_openSubCache[osKey]) {
        try {
            const params = new URLSearchParams({ type, id });
            if (type === 'tv') {
                params.set('s', season || 1);
                params.set('e', episode || 1);
            }
            const resp = await fetch(`/api/subs?${params}`);
            const data = await resp.json();
            if (data.success) {
                online = (data.subtitles || []).map(s => ({ ...s, src: 'os' }));
                _openSubCache[osKey] = online;
            }
        } catch (e) {
            console.warn('Subtitle fetch failed:', e.message);
        }
    }

    const all = [...embedded, ...online];
    subSel.disabled = false;

    if (all.length === 0) {
        subSel.innerHTML = '<option value="">Subtitle tidak tersedia</option>';
        return;
    }

    // Route every subtitle through /api/sub (SRT→VTT + CORS)
    _subtitleList = all.map((s, i) => ({
        ...s,
        idx: i,
        proxied: `/api/sub?url=${encodeURIComponent(s.url)}`,
    }));

    subSel.innerHTML =
        `<option value="">CC Off</option>` +
        _subtitleList.map(s => `<option value="${s.idx}">${s.label}</option>`).join('');

    // Auto-pick Indonesian, then Malay, then English
    const pick = _subtitleList.find(s => s.lang === 'ind' || s.lang === 'id')
        || _subtitleList.find(s => s.lang === 'may' || s.lang === 'msa')
        || _subtitleList.find(s => s.lang === 'eng' || s.lang === 'en');

    if (pick) {
        subSel.value = String(pick.idx);
        applySubtitle(pick.idx);
    }
}

function setSubtitle(idxStr) {
    const video = document.getElementById('video');
    if (!video) return;

    video.querySelectorAll('track').forEach(t => t.remove());
    for (let i = 0; i < video.textTracks.length; i++) video.textTracks[i].mode = 'disabled';
    if (_hls) _hls.subtitleTrack = -1;

    if (idxStr === '' || idxStr == null) return; // CC Off
    applySubtitle(parseInt(idxStr, 10));
}

function applySubtitle(idx) {
    const video = document.getElementById('video');
    const sub = _subtitleList[idx];
    if (!video || !sub) return;

    video.querySelectorAll('track').forEach(t => t.remove());

    const track = document.createElement('track');
    track.kind = 'subtitles';
    track.label = sub.label;
    track.srclang = (sub.lang || 'en').slice(0, 2);
    track.src = sub.proxied;
    track.default = true;
    video.appendChild(track);

    track.addEventListener('load', () => { track.track.mode = 'showing'; });
    track.addEventListener('error', () => {
        console.warn('Subtitle failed to load:', sub.label);
    });

    setTimeout(() => {
        for (let i = 0; i < video.textTracks.length; i++) {
            video.textTracks[i].mode = 'showing';
        }
    }, 300);
}

function setQuality(level) {
    if (_hls) {
        _hls.currentLevel = parseInt(level);
    }
}

function retryPlayer() {
    const { type, id, season, episode } = currentState;
    navigate('player', { type, id, season, episode });
}

async function prevEpisode(id, s, e) {
    if (e > 1) navigate('player', { type: 'tv', id, season: s, episode: e - 1 });
}
async function nextEpisode(id, s, e) {
    navigate('player', { type: 'tv', id, season: s, episode: e + 1 });
}

// ===== Init =====
buildProviderMenu();

// Dropdown open/close wiring
document.getElementById('nav-provider')?.addEventListener('click', toggleProviderMenu);
document.addEventListener('click', (e) => {
    if (!e.target.closest('.nav-dropdown')) closeProviderMenu();
});
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeProviderMenu();
});

navigate('home');
</script>
